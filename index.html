<!DOCTYPE html>
<html lang="en">
<head>
    </head>
<body class="flex items-center justify-center p-4 min-h-screen bg-black overflow-hidden font-sans">
    <canvas id="render-canvas" class="fixed top-0 left-0 -z-10 w-full h-full"></canvas>

    <div id="app" class="max-w-6xl w-full floating-ui p-6 sm:p-10 relative animate__animated animate__fadeIn">
        <div id="scr-menu">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-8 px-4">
                <div class="text-center sm:text-left">
                    <h1 class="text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500 mb-1">mathpuzzle.xyz</h1>
                    <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">স্মার্ট বাচ্চাদের লজিক্যাল ৩ডি গেম</p>
                </div>
                <div class="flex flex-col items-center sm:items-end gap-1">
                    <button onclick="installApp()" class="download-btn px-6 py-2 rounded-xl text-[9px] font-black text-white uppercase tracking-wider">📥 অ্যাপটি সেভ করুন</button>
                    <p class="text-[8px] text-cyan-400 font-bold italic">লিঙ্ক হারানোর ভয় নেই, সরাসরি খেলুন!</p>
                </div>
            </div>
            
            <div class="flex justify-center mb-6">
                <div id="status-badge" class="px-6 py-1.5 rounded-full text-[9px] font-black border border-white/10 uppercase tracking-widest text-slate-500">Verifying...</div>
            </div>

            <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4 mb-6"></div>
            
            <div id="id-display" class="p-8 rounded-[40px] text-center border border-white/5 bg-transparent">
                <p class="text-[9px] text-slate-400 font-bold uppercase mb-2 tracking-widest">আপনার ইউনিক ডিভাইস আইডি</p>
                <h3 id="device-id-txt" class="text-3xl font-black text-white tracking-widest mb-6 uppercase">LOADING...</h3>
                
                <div id="cta-action" class="flex flex-col items-center max-w-lg mx-auto">
                    </div>
            </div>
        </div>

        </div>

    <script src="js/engine.js"></script>
    <script src="js/games/fruitMath.js"></script>
    <script src="js/games/pyramidMath.js"></script>
    <script src="js/games/patternMath.js"></script>
    <script src="js/games/sudokuMath.js"></script>
    <script src="js/games/magicSquare.js"></script>
    <script src="js/games/missingNo.js"></script>
    <script src="js/games/compareMath.js"></script>
    <script src="js/games/timeTravel.js"></script> <script>
        const WA_NUMBER = "8801303680618";
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS2geQz6QVkVrAYDhVY3WWKrD7MK1RoHna3nb3NpANiTd-RX24I_xmfTzgbnK4sC1Y8yu7eXSoyanZO/pub?output=csv"; 
        
        // ... getDeviceID & checkMembership ফাংশন আগের মতোই থাকবে ...

        function updateUI(id) {
            const badge = document.getElementById('status-badge');
            const ctaZone = document.getElementById('cta-action');
            const waLink = `https://wa.me/${WA_NUMBER}?text=Hello, I want to UNLOCK all 15 puzzles for my Device ID: ${id}`;
            
            if(state.isPremium) {
                badge.innerHTML = "PREMIUM MEMBER ✅";
                badge.className = "px-6 py-1.5 rounded-full text-[9px] font-black border border-cyan-500/30 text-cyan-400 uppercase bg-cyan-500/5";
                ctaZone.innerHTML = `
                    <p class="text-xs text-slate-400 mb-4">যেকোনো টেকনিক্যাল সাপোর্টের জন্য সরাসরি ডেভেলপারের সাথে কথা বলুন।</p>
                    <a href="https://wa.me/${WA_NUMBER}?text=Hi Ashique, Help needed for ID: ${id}" class="bg-green-600/20 text-green-400 border border-green-600/30 px-8 py-3 rounded-2xl font-bold text-xs hover:bg-green-600 hover:text-white transition-all">Developer Support (WhatsApp)</a>
                `;
            } else {
                badge.innerHTML = "FREE VERSION 🎁";
                ctaZone.innerHTML = `
                    <div class="space-y-4">
                        <p class="text-sm text-white font-medium leading-relaxed">
                            ১৫টি গেমই এক বছরের জন্য আনলক করতে এই নাম্বারে হোয়াটসঅ্যাপ করুন: <br>
                            <span class="text-cyan-400 font-black text-xl tracking-wider">${WA_NUMBER}</span> <br>
                            অথবা সরাসরি নিচের লিঙ্কে ক্লিক করুন।
                        </p>
                        <a href="${waLink}" class="inline-block bg-gradient-to-r from-cyan-500 to-blue-600 text-white px-10 py-4 rounded-2xl font-black text-xs shadow-2xl hover:scale-105 transition-all">সরাসরি হোয়াটসঅ্যাপে ক্লিক করুন 🚀</a>
                        <p class="text-[9px] text-slate-500 uppercase tracking-widest mt-2 animate-pulse font-bold">পেমেন্ট করার ৫ মিনিটের মধ্যেই আনলক হবে ইনশাআল্লাহ!</p>
                    </div>
                `;
            }
        }

        function nextPuzzle() {
            clearInterval(state.interval);
            let data;
            if(state.gameId === 'fr') data = FruitMath.generate();
            else if(state.gameId === 'py') data = PyramidMath.generate();
            else if(state.gameId === 'pt') data = PatternMath.generate();
            else if(state.gameId === 'sd') data = SudokuMath.generate();
            else if(state.gameId === 'ms') data = MagicSquare.generate();
            else if(state.gameId === 'msn') data = MissingNo.generate();
            else if(state.gameId === 'cmp') data = CompareMath.generate();
            else if(state.gameId === 'tm') data = TimeTravel.generate(); // ৮ম গেম
            
            document.getElementById('puzzle-stage').innerHTML = data.question;
            // ... MCQ রেন্ডারিং লজিক আগের মতোই থাকবে ...
        }
        
        // ... বাকি গেম লজিক ফাংশনগুলো আগের মতোই থাকবে ...
    </script>
</body>
</html>
