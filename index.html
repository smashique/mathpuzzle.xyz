<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mathpuzzle.xyz | ৩ডি ব্রেইন বুস্টার</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* */
        :root { --cyan: #22d3ee; --fuchsia: #d946ef; --slate: #94a3b8; }
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        
        .flex { display: flex; } .items-center { align-items: center; } .justify-center { justify-content: center; }
        .flex-col { flex-direction: column; } .text-center { text-align: center; } .relative { position: relative; }
        .grid { display: grid; } .gap-4 { gap: 1rem; } .mb-6 { margin-bottom: 1.5rem; }
        .min-h-screen { min-height: 100vh; } .w-full { width: 100%; } .max-w-6xl { max-width: 72rem; }

        /* 1) Frame Transparent & Glassmorphism */
        .floating-ui { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 3rem; 
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-height: 90vh;
            overflow-y: auto;
        }

        .id-bar {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2rem;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .game-btn { 
            background: rgba(255, 255, 255, 0.03) !important; /* Fully Transparent */
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 1.5rem; 
            padding: 1rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .game-btn:hover { transform: scale(1.05) translateY(-5px); background: rgba(34, 211, 238, 0.1) !important; border-color: var(--cyan); }
        
        .lock-icon { position: absolute; top: 10px; right: 10px; font-size: 10px; opacity: 0.5; }

        .input-box { background: rgba(255,255,255,0.05); border: 1px solid var(--cyan); border-radius: 1rem; padding: 1rem; color: white; width: 100%; margin-bottom: 1rem; font-size: 1rem; outline: none; }
        .primary-btn { background: linear-gradient(45deg, var(--cyan), var(--fuchsia)); border: none; padding: 1rem 2rem; border-radius: 1.5rem; color: white; font-weight: 900; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 1rem; }

        .text-gradient { background: linear-gradient(to right, var(--cyan), var(--fuchsia)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hidden { display: none !important; }
        #render-canvas { position: fixed; top: 0; left: 0; z-index: -10; width: 100%; height: 100%; }
        
        /* Progress & Hints */
        .progress-card { background: rgba(34, 211, 238, 0.05); border-radius: 1rem; padding: 0.8rem; margin-top: 1rem; font-size: 0.7rem; text-align: center; border: 1px solid rgba(34, 211, 238, 0.1); }
        .hint-box { background: rgba(217, 70, 239, 0.05); border-left: 4px solid var(--fuchsia); padding: 0.8rem; margin: 1rem 0; font-size: 0.85rem; color: #fdf4ff; }

        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        @media (min-width: 640px) { .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (min-width: 768px) { .grid-cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <canvas id="render-canvas"></canvas>

    <div id="app" class="max-w-6xl w-full floating-ui relative">
        <div id="scr-menu">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6">
                <div class="text-center sm:text-left">
                    <h1 class="text-gradient" style="font-size: 2rem; font-weight: 900; margin: 0;">mathpuzzle.xyz</h1>
                    <p style="color: var(--slate); font-size: 9px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.1em;">স্মার্ট বাচ্চাদের লজিক্যাল ৩ডি গেম</p>
                </div>
                <div id="guardian-portal" class="progress-card">
                    <b>অগ্রগতি:</b> <span id="progress-val">0%</span>
                </div>
            </div>

            <div class="id-bar">
                <p style="font-size: 8px; color: var(--slate); font-weight: bold; text-transform: uppercase; margin-bottom: 0.3rem;">আপনার ইউনিক ডিভাইস আইডি</p>
                <h3 id="device-id-txt" style="font-size: 1.2rem; font-weight: 900; margin: 0; color: white; letter-spacing: 0.1em;">---</h3>
                <div id="cta-action" style="margin-top: 10px;"></div>
            </div>
            
            <div id="game-grid" class="grid grid-cols-2 gap-4 mb-8"></div>
        </div>

        <div id="scr-setup" class="hidden">
            <button onclick="showScreen('scr-menu')" style="background: none; border: none; color: var(--slate); font-size: 10px; cursor: pointer; margin-bottom: 1rem;">← ফিরে যাও</button>
            <h1 class="text-center text-gradient">কয়জন খেলতে চাও?</h1>
            <div class="grid grid-cols-3 gap-4 mb-8">
                <button onclick="setPlayers(1)" class="game-btn">1 জন</button>
                <button onclick="setPlayers(2)" class="game-btn">2 জন</button>
                <button onclick="setPlayers(3)" class="game-btn">3 জন</button>
            </div>
            
            <div id="name-inputs" class="hidden">
                <div id="input-container"></div>
                <h2 class="text-center" style="color: var(--fuchsia); font-size: 1rem;">তোমার বয়স কত?</h2>
                <select id="age-range" class="input-box">
                    <option value="4-6">4-6 বছর (সহজ)</option>
                    <option value="7-9">7-9 বছর (মাঝারি)</option>
                    <option value="10-13">10-13 বছর (কঠিন)</option>
                </select>
                <button onclick="confirmSetup()" class="primary-btn">গেম শুরু করো 🚀</button>
            </div>
        </div>

        <div id="scr-engine" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <div id="player-turn" style="color: var(--cyan); font-weight: 900; font-size: 1.2rem;"></div>
                <div id="clock-txt" style="color: #ef4444; font-size: 2.2rem; font-family: monospace; font-weight: 900;">15.0</div>
            </div>
            <div id="inst-hint" class="hint-box"></div>
            <div id="puzzle-stage" style="min-height: 200px; font-size: 3.5rem; text-align: center; margin: 1.5rem 0; font-weight: 900;"></div>
            <div id="mcq-grid" class="grid grid-cols-2 gap-4" style="max-width: 400px; margin: 0 auto;"></div>
            <button id="lvl-up-btn" onclick="levelUp()" class="hidden primary-btn" style="margin-top: 2rem;">পরবর্তী লেভেল ⬆️</button>
        </div>
    </div>

    <script src="js/engine.js"></script>
    <script src="js/games/fruitMath.js"></script>
    <script src="js/games/pyramidMath.js"></script>
    <script src="js/games/patternMath.js"></script>
    <script src="js/games/sudokuMath.js"></script>
    <script src="js/games/magicSquare.js"></script>
    <script src="js/games/missingNo.js"></script>
    <script src="js/games/compareMath.js"></script>
    <script src="js/games/timeTravel.js"></script>
    <script src="js/games/fractionMath.js"></script>
    <script src="js/games/shapeCount.js"></script>
    <script src="js/games/matchstick.js"></script>
    <script src="js/games/memoryMatch.js"></script>
    <script src="js/games/kakuroMath.js"></script>
    <script src="js/games/codeBreaker.js"></script>
    <script src="js/games/symmetry.js"></script>

    <script>
        /* Neuro-marketing Data */
        const WA_NUMBER = "8801303680618";
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS2geQz6QVkVrAYDhVY3WWKrD7MK1RoHna3nb3NpANiTd-RX24I_xmfTzgbnK4sC1Y8yu7eXSoyanZO/pub?output=csv"; 
        
        const GAMES_LIST = [
            {id:'fr', n:'Fruit Math', i:'🍎', b:'বুদ্ধি বাড়ে ১০০%', u:'ফল দিয়ে বুদ্ধির লড়াই! এটি খেললে বাচ্চার গণিতের ভয় কাটবে এবং দ্রুত হিসাব করার ক্ষমতা বাড়বে।'},
            {id:'py', n:'Pyramid', i:'⛰️', b:'লজিক্যাল থিঙ্কিং', u:'পিরামিড পাজল সমাধান করলে বাচ্চার ব্রেইন কানেকশন মজবুত হয় এবং গভীর চিন্তার ক্ষমতা তৈরি হয়।'},
            {id:'pt', n:'Pattern', i:'🧩', b:'আইকিউ বুস্টার', u:'প্যাটার্ন খোঁজার চ্যালেঞ্জ! এটি বাচ্চার আইকিউ (IQ) এবং ভিজ্যুয়াল মেমোরি বহুগুণ বাড়িয়ে দেয়।'},
            {id:'sd', n:'Sudoku', i:'🔢', b:'একাগ্রতা বৃদ্ধি', u:'সুডোকু খেললে বাচ্চার মনোযোগ বা কনসেন্ট্রেশন পাওয়ার বাড়ে, যা পড়াশোনায় অনেক সাহায্য করে।'},
            {id:'ms', n:'Magic Square', i:'⬛', b:'ম্যাথ জিনিয়াস', u:'ম্যাজিক স্কোয়ার সমাধান করে আপনার বাচ্চাকে বানান আগামীর ম্যাথ জিনিয়াস!'},
            {id:'msn', n:'Missing No', i:'❓', b:'ধাঁধা সমাধান', u:'লুকানো সংখ্যা খুঁজে বের করার মাধ্যমে বাচ্চার লজিক্যাল রিজননিং ক্ষমতা বৃদ্ধি পায়।'},
            {id:'cmp', n:'Compare', i:'⚖️', b:'তুলনা করার দক্ষতা', u:'ছোট-বড় এবং ওজনের তুলনা শেখার মাধ্যমে বাচ্চার গাণিতিক ধারণা পরিষ্কার হয়।'},
            {id:'tm', n:'Time Travel', i:'⏰', b:'সময় সচেতনতা', u:'সময় সচেতনতা এবং ঘড়ি দেখার সঠিক ধারণা তৈরির মাধ্যমে বাচ্চার মেধা বিকশিত হয়।'},
            {id:'frx', n:'Fraction', i:'🍕', b:'পিজ্জা ম্যাথ', u:'পিজ্জা স্লাইস দিয়ে ভগ্নাংশ শেখা! এটি ভগ্নাংশের মতো কঠিন বিষয়কে সবচেয়ে সহজ করে তোলে।'},
            {id:'sc', n:'Shape Count', i:'🔺', b:'জ্যামিতি মাস্টার', u:'জ্যামিতিক আকৃতি চেনার মাধ্যমে বাচ্চার ভিজ্যুয়াল স্পেশিয়াল ইন্টেলিজেন্স বৃদ্ধি পায়।'},
            {id:'mt', n:'Matchstick', i:'🕯️', b:'সমস্যা সমাধান', u:'ম্যাচস্টিক পাজল সমাধানের মাধ্যমে বাচ্চার জটিল সমস্যা সহজে সমাধানের মানসিকতা তৈরি হয়।'},
            {id:'mm', n:'Memory Match', i:'🧠', b:'ব্রেইন পাওয়ার', u:'মেমোরি কার্ড গেম খেললে বাচ্চার মনে রাখার ক্ষমতা বা মেমোরি রিটেনশন বহুগুণ বেড়ে যায়।'},
            {id:'kk', n:'Kakuro', i:'✖️', b:'সুপার ক্যালকুলেটর', u:'কাকুরু পাজল সমাধান করলে বাচ্চা সুপার ফাস্ট ক্যালকুলেটরে পরিণত হয়!'},
            {id:'cb', n:'Code Breaker', i:'🔐', b:'সিক্রেট কোড', u:'গোপন কোড ব্রেক করার মাধ্যমে বাচ্চার ক্রিটিক্যাল থিঙ্কিং এবং এনালাইটিক্যাল স্কিল বাড়ে।'},
            {id:'sy', n:'Symmetry', i:'🌗', b:'চিত্রাঙ্কন মেধা', u:'সিমেট্রি বা প্রতিসাম্য শেখার মাধ্যমে বাচ্চার সৃজনশীলতা এবং আর্টিস্টিক মেধা বিকশিত হয়।'}
        ];

        let session = { players: [], currentPlayerIdx: 0, ageRange: '4-6', progress: {}, id: '', selectedGameIdx: -1 };
        let state = { gameId:'', turn:0, score:0, isPremium: false };

        window.addEventListener('load', () => {
            session.id = getDeviceID();
            document.getElementById('device-id-txt').innerText = session.id;
            try { if(typeof ThreeEngine !== 'undefined') ThreeEngine.init(); } catch(e) {}
            
            // Progress Load
            const saved = localStorage.getItem('mp_progress_' + session.id);
            if(saved) { session.progress = JSON.parse(saved); updateProgressUI(); }

            renderGrid();
            updateUI(session.id);
            syncMembership(session.id);
        });

        /* 2) Multiplayer Setup ebong 5) Age Setup Logic */
        function handleGameClick(idx) {
            session.selectedGameIdx = idx;
            const game = GAMES_LIST[idx];
            if(!state.isPremium && idx !== 0) {
                showBenefitModal(game);
            } else {
                if(session.players.length === 0) {
                    showScreen('scr-setup');
                } else {
                    startGame(game.id);
                }
            }
        }

        function setPlayers(num) {
            const container = document.getElementById('input-container');
            container.innerHTML = `<h2 class="text-center" style="font-size:1rem;">খেলোয়াড়দের নাম লেখো:</h2>`;
            for(let i=1; i<=num; i++) {
                container.innerHTML += `<input type="text" id="p-name-${i}" placeholder="প্লেয়ার ${i} এর নাম" class="input-box">`;
            }
            document.getElementById('name-inputs').classList.remove('hidden');
        }

        function confirmSetup() {
            const inputs = document.querySelectorAll('#input-container input');
            session.players = Array.from(inputs).map(inp => ({ name: inp.value || 'Player', score: 0, level: 1 }));
            session.ageRange = document.getElementById('age-range').value;
            startGame(GAMES_LIST[session.selectedGameIdx].id);
        }

        function startGame(gameId) {
            state.gameId = gameId;
            document.getElementById('player-turn').innerText = "খেলছে: " + session.players[session.currentPlayerIdx].name;
            // 6) Instruction Hint
            const hints = { fr: "ফলের সঠিক মান বের করো।", py: "নিচের দুটির যোগফল উপরে বসাও।", frx: "পিজ্জার স্লাইস গুনে ভগ্নাংশ মেলাও।" };
            document.getElementById('inst-hint').innerText = "নির্দেশনা: " + (hints[gameId] || "সঠিক উত্তরটি সিলেক্ট করো।");
            showScreen('scr-engine');
            nextPuzzle();
        }

        /* 3) Level Up ebong 8) Progress */
        function levelUp() {
            session.players[session.currentPlayerIdx].level++;
            alert("চমৎকার! তুমি লেভেল " + session.players[session.currentPlayerIdx].level + "-এ উঠেছো!");
            nextPuzzle();
        }

        function checkAns(val) {
            const gamesMap = { fr: FruitMath, py: PyramidMath, pt: PatternMath, sd: SudokuMath, ms: MagicSquare, msn: MissingNo, cmp: CompareMath, tm: TimeTravel, frx: FractionMath, sc: ShapeCount, mt: Matchstick, mm: MemoryMatch, kk: KakuroMath, cb: CodeBreaker, sy: Symmetry };
            if(val == gamesMap[state.gameId].answer) { 
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                if(typeof SoundEffects !== 'undefined') SoundEffects.play('success');
                
                // Progress tracking
                session.progress[state.gameId] = true;
                localStorage.setItem('mp_progress_' + session.id, JSON.stringify(session.progress));
                updateProgressUI();

                // 2) Player Turn switch
                session.currentPlayerIdx = (session.currentPlayerIdx + 1) % session.players.length;
                document.getElementById('player-turn').innerText = "খেলছে: " + session.players[session.currentPlayerIdx].name;
                
                setTimeout(nextPuzzle, 1000); 
            } else { 
                if(typeof SoundEffects !== 'undefined') SoundEffects.play('fail');
                alert("আবার চেষ্টা করো সোনামণি!"); 
            }
        }

        /* Helper Functions */
        function getDeviceID() {
            let id = localStorage.getItem('mp_dev_id') || ('ID-' + Math.random().toString(36).substr(2, 6).toUpperCase());
            localStorage.setItem('mp_dev_id', id);
            return id;
        }

        function updateProgressUI() {
            const percent = Math.round((Object.keys(session.progress).length / 15) * 100);
            document.getElementById('progress-val').innerText = percent + '%';
        }

        function renderGrid() {
            const grid = document.getElementById('game-grid');
            if(!grid) return;
            grid.innerHTML = ''; 
            GAMES_LIST.forEach((g, idx) => {
                const isLocked = !state.isPremium && idx !== 0; 
                grid.innerHTML += `
                    <div onclick="handleGameClick(${idx})" class="game-btn flex flex-col items-center">
                        ${isLocked ? '<span class="lock-icon">🔒</span>' : ''}
                        <span style="font-size: 2rem; margin-bottom: 0.5rem;">${g.i}</span>
                        <span style="font-size: 8px; font-weight: 900; color: white; text-transform: uppercase;">${g.n}</span>
                        <span style="font-size: 7px; font-weight: bold; color: var(--cyan); margin-top: 4px;">${g.b}</span>
                    </div>`;
            });
        }

        function showScreen(id) { document.querySelectorAll('#app > div').forEach(d => d.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
        async function syncMembership(id) { /* Sheet Sync Code */ try { const res = await fetch(SHEET_CSV_URL); const csv = await res.text(); /* ... logic ... */ } catch(e) {} }
        function updateUI(id) { const ctaZone = document.getElementById('cta-action'); if(!ctaZone) return; ctaZone.innerHTML = `<a href="https://wa.me/${WA_NUMBER}?text=Unlock all 15 puzzles for ID: ${id}" style="display: inline-block; background: linear-gradient(to right, #06b6d4, #2563eb); color: white; padding: 0.5rem 1.2rem; border-radius: 1.5rem; text-decoration: none; font-weight: 900; font-size: 0.65rem; box-shadow: 0 10px 20px rgba(0,0,0,0.3);">সরাসরি হোয়াটসঅ্যাপ করুন 🚀</a>`; }
