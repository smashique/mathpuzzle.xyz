<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>mathpuzzle.xyz | Free</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen">
    <canvas id="bg-canvas"></canvas>
    
    <div id="setup-screen" class="glass-ui p-8 max-w-lg w-full text-center animate__animated animate__fadeIn">
        <h2 class="text-2xl font-bold mb-6 text-cyan-400">খেলোয়াড়ের তথ্য</h2>
        <input type="text" id="player-name" placeholder="তোমার নাম" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 mb-4 text-center outline-none focus:border-cyan-400">
        <input type="number" id="player-number" placeholder="মোবাইল নম্বর" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 mb-6 text-center outline-none focus:border-cyan-400">
        
        <p class="text-sm mb-4 text-slate-300">বয়স বিভাগ বেছে নাও:</p>
        <div class="grid grid-cols-3 gap-2 mb-8">
            <button onclick="setAge('4-5')" class="age-btn bg-white/5 border border-white/10 p-2 rounded-xl text-[10px] hover:bg-cyan-500">৪-৫ বছর</button>
            <button onclick="setAge('6-7')" class="age-btn bg-white/5 border border-white/10 p-2 rounded-xl text-[10px] hover:bg-cyan-500">৬-৭ বছর</button>
            <button onclick="setAge('8-9')" class="age-btn bg-white/5 border border-white/10 p-2 rounded-xl text-[10px] hover:bg-cyan-500">৮-৯ বছর</button>
            <button onclick="setAge('10-11')" class="age-btn bg-white/5 border border-white/10 p-2 rounded-xl text-[10px] hover:bg-cyan-500">১০-১১ বছর</button>
            <button onclick="setAge('12+')" class="age-btn bg-white/5 border border-white/10 p-2 rounded-xl text-[10px] hover:bg-cyan-500">১২+ বছর</button>
        </div>
        <button onclick="goToMenu()" class="w-full bg-cyan-600 py-4 rounded-2xl font-black hover:bg-cyan-500 shadow-lg transition-all">গেম শুরু করো</button>
    </div>

    <div id="main-menu" class="hidden glass-ui animate__animated animate__fadeIn">
        <div class="flex justify-between items-center mb-8 px-4">
            <h1 class="text-3xl font-black text-cyan-400">mathpuzzle.xyz</h1>
            <div id="welcome-msg" class="text-xs font-bold text-white bg-white/10 px-4 py-2 rounded-full"></div>
        </div>
        <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4"></div>
    </div>

    <div id="game-screen" class="hidden glass-ui p-10 max-w-2xl w-full text-center relative animate__animated animate__zoomIn">
        <div id="timer-display" class="absolute top-6 right-8 text-2xl font-black text-yellow-400">15s</div>
        <div id="level-tag" class="absolute top-6 left-8 text-xs font-bold uppercase tracking-widest text-cyan-400">Easy</div>
        <div id="puzzle-area" class="my-12 text-4xl font-black leading-relaxed"></div>
        <div id="mcq-grid" class="grid grid-cols-2 gap-4"></div>
    </div>

    <div id="lock-modal" class="modal-overlay hidden">
        <div class="bg-white/10 p-10 rounded-[3rem] backdrop-blur-3xl text-center border border-white/10">
            <span class="text-6xl">🔒</span>
            <h2 class="text-2xl font-bold mt-4">পাজলটি লক করা!</h2>
            <p class="text-slate-300 mb-6 text-sm">সবগুলো প্রিমিয়াম পাজল আনলক করতে আমাদের হোয়াটসঅ্যাপে মেসেজ দিন।</p>
            <button onclick="window.open('https://wa.me/8801303680618?text=Ami premium puzzles unlock korte chai')" class="bg-green-500 px-8 py-4 rounded-2xl font-black transition-all hover:bg-green-600">WhatsApp Message</button>
            <button onclick="document.getElementById('lock-modal').classList.add('hidden')" class="block w-full mt-4 text-sm text-slate-400">বন্ধ করুন</button>
        </div>
    </div>

    <script src="js/engine.js"></script>
    <script src="js/games/fruitMath.js"></script> 
    <script>
        const GAMES_LIST = [
            {id:'fr', n:'Fruit Math', i:'🍎'}, {id:'py', n:'Pyramid', i:'⛰️'},
            {id:'pt', n:'Pattern', i:'🧩'}, {id:'sd', n:'Sudoku', i:'🔢'},
            {id:'ms', n:'Magic Square', i:'⬛'}, {id:'msn', n:'Missing No', i:'❓'},
            {id:'cmp', n:'Compare', i:'⚖️'}, {id:'tm', n:'Time Travel', i:'⏰'},
            {id:'frx', n:'Fraction', i:'🍕'}, {id:'sh', n:'Shape Count', i:'🔺'},
            {id:'mc', n:'Matchstick', i:'🕯️'}, {id:'mem', n:'Memory', i:'🧠'},
            {id:'kk', n:'Kakuro', i:'✖️'}, {id:'cd', n:'Code Breaker', i:'🔐'},
            {id:'sy', n:'Symmetry', i:'🌓'}
        ];

        let countdown, score = 0, selectedAge = '4-5';
        let playerData = { name: '', number: '' };

        function setAge(age) {
            selectedAge = age;
            document.querySelectorAll('.age-btn').forEach(b => b.classList.remove('bg-cyan-500'));
            event.target.classList.add('bg-cyan-500');
        }

        function goToMenu() {
            playerData.name = document.getElementById('player-name').value;
            playerData.number = document.getElementById('player-number').value;
            if(!playerData.name || !playerData.number) return alert("সব তথ্য দাও!");

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = "স্বাগতম, " + playerData.name;
            renderMenu();
        }

        function renderMenu() {
            const grid = document.getElementById('game-grid');
            GAMES_LIST.forEach((g, idx) => {
                const isLocked = idx !== 0; 
                grid.innerHTML += `
                    <div onclick="${isLocked ? "document.getElementById('lock-modal').classList.remove('hidden')" : "initFruitGame()"}" 
                         class="game-card p-6 rounded-[2rem] flex flex-col items-center ${isLocked ? 'locked-card' : ''}">
                        <span class="text-4xl mb-2">${g.i}</span>
                        <span class="text-xs font-bold text-white tracking-wide">${g.n}</span>
                    </div>`;
            });
        }

        function initFruitGame() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            score = 0;
            // বয়স অনুযায়ী লেভেল ম্যাপিং
            if(selectedAge === '4-5') FruitMath.level = 'easy';
            else if(selectedAge === '6-7') FruitMath.level = 'easy-medium';
            else if(selectedAge === '8-9') FruitMath.level = 'medium';
            else if(selectedAge === '10-11') FruitMath.level = 'medium-hard';
            else FruitMath.level = 'hard';
            nextQuestion();
        }

        function nextQuestion() {
            clearInterval(countdown);
            const data = FruitMath.generate();
            document.getElementById('level-tag').innerText = FruitMath.level;
            document.getElementById('puzzle-area').innerHTML = data.question;
            const mcqGrid = document.getElementById('mcq-grid');
            mcqGrid.innerHTML = '';
            data.options.forEach(opt => {
                mcqGrid.innerHTML += `<button onclick="handleAnswer(${opt})" class="bg-white/10 hover:bg-cyan-500 p-6 rounded-3xl text-2xl font-bold border border-white/10 transition-all active:scale-95">${opt}</button>`;
            });
            startTimer();
        }

        function startTimer() {
            let time = 15;
            const display = document.getElementById('timer-display');
            display.innerText = time + "s";
            countdown = setInterval(() => {
                time--; display.innerText = time + "s";
                if(time <= 0) { clearInterval(countdown); gameOver("সময় শেষ! ⏳"); }
            }, 1000);
        }

        function handleAnswer(selected) {
            clearInterval(countdown);
            if(selected === FruitMath.answer) {
                score++;
                if(score >= 5) {
                    score = 0;
                    // লেভেল আপ লজিক
                    const levels = ['easy', 'easy-medium', 'medium', 'medium-hard', 'hard'];
                    let idx = levels.indexOf(FruitMath.level);
                    if(idx < levels.length - 1) FruitMath.level = levels[idx+1];
                    alert("লেভেল আপ! 🎉");
                }
                nextQuestion();
            } else { gameOver("ভুল উত্তর! ❌"); }
        }

        function gameOver(msg) { alert(msg); location.reload(); }

        window.addEventListener('load', () => { if (typeof ThreeEngine !== 'undefined') ThreeEngine.init(); });
    </script>
</body>
</html>
