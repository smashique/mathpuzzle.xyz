<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mathpuzzle.xyz | ৩ডি ব্রেইন বুস্টার</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { --cyan: #22d3ee; --fuchsia: #d946ef; --slate: #94a3b8; }
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        
        /* ৩ডি ব্যাকগ্রাউন্ড ফিক্স */
        #render-canvas { position: fixed; top: 0; left: 0; z-index: -10; width: 100%; height: 100%; pointer-events: none; }

        /* গ্রিড লেআউট ফিক্স (Row এর বদলে Column) */
        .grid { display: grid !important; gap: 1rem; }
        .grid-cols-2 { grid-template-columns: repeat(2, 1fr) !important; }
        @media (min-width: 768px) { .grid-cols-5 { grid-template-columns: repeat(5, 1fr) !important; } }

        .floating-ui { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 3rem; padding: 2rem;
            max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* স্বচ্ছ বাটন ডিজাইন */
        .game-btn { 
            background: rgba(255, 255, 255, 0.05) !important; 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1) !important; 
            border-radius: 1.5rem; padding: 1rem; cursor: pointer;
            transition: all 0.3s ease; position: relative; text-align: center;
        }
        .game-btn:hover { background: rgba(34, 211, 238, 0.1) !important; border-color: var(--cyan) !important; transform: translateY(-5px); }
        
        .flex { display: flex; } .items-center { align-items: center; } .justify-between { justify-content: space-between; }
        .flex-col { flex-direction: column; } .hidden { display: none !important; }
        .text-gradient { background: linear-gradient(to right, var(--cyan), var(--fuchsia)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .lock-icon { position: absolute; top: 10px; right: 10px; font-size: 10px; opacity: 0.5; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <canvas id="render-canvas"></canvas>

    <div id="app" class="max-w-6xl w-full floating-ui relative">
        <div id="scr-menu">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6">
                <div>
                    <h1 class="text-gradient" style="font-size: 2rem; font-weight: 900; margin: 0;">mathpuzzle.xyz</h1>
                    <p style="color: var(--slate); font-size: 9px; font-weight: bold; text-transform: uppercase;">স্মার্ট বাচ্চাদের লজিক্যাল ৩ডি গেম</p>
                </div>
                <div style="background: rgba(34, 211, 238, 0.1); border-radius: 1rem; padding: 0.8rem; font-size: 0.75rem;">
                    <b>অগ্রগতি:</b> <span id="progress-val">0%</span>
                </div>
            </div>

            <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 2rem; padding: 1.2rem; margin-bottom: 1.5rem; text-align: center;">
                <p style="font-size: 8px; color: var(--slate); font-weight: bold; text-transform: uppercase;">ইউনিক ডিভাইস আইডি</p>
                <h3 id="device-id-txt" style="font-size: 1.2rem; font-weight: 900; margin: 5px 0;">---</h3>
                <div id="cta-action"></div>
            </div>
            
            <div id="game-grid" class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8"></div>
        </div>

        <div id="scr-setup" class="hidden">
            <h2 class="text-center">কয়জন খেলতে চাও?</h2>
            <div class="grid grid-cols-3 gap-4 mb-8" style="margin-top: 2rem;">
                <button onclick="setPlayers(1)" class="game-btn">1 জন</button>
                <button onclick="setPlayers(2)" class="game-btn">2 জন</button>
                <button onclick="setPlayers(3)" class="game-btn">3 জন</button>
            </div>
            <div id="name-inputs" class="hidden">
                <div id="input-container"></div>
                <button onclick="confirmSetup()" class="game-btn" style="width: 100%; background: var(--fuchsia) !important; margin-top: 1rem;">গেম শুরু করো 🚀</button>
            </div>
        </div>

        <div id="scr-engine" class="hidden">
            </div>
    </div>

    <script src="js/engine.js"></script>
    <script src="js/games/fruitMath.js"></script>
    <script src="js/games/pyramidMath.js"></script>
    <script src="js/games/patternMath.js"></script>
    <script src="js/games/sudokuMath.js"></script>
    <script src="js/games/magicSquare.js"></script>
    <script src="js/games/missingNo.js"></script>
    <script src="js/games/compareMath.js"></script>
    <script src="js/games/timeTravel.js"></script>
    <script src="js/games/fractionMath.js"></script>
    <script src="js/games/shapeCount.js"></script>
    <script src="js/games/matchstick.js"></script>
    <script src="js/games/memoryMatch.js"></script>
    <script src="js/games/kakuroMath.js"></script>
    <script src="js/games/codeBreaker.js"></script>
    <script src="js/games/symmetry.js"></script>

    <script>
        const WA_NUMBER = "8801303680618";
        const GAMES_LIST = [
            {id:'fr', n:'Fruit Math', i:'🍎', b:'বুদ্ধি বাড়ে ১০০%'},
            {id:'py', n:'Pyramid', i:'⛰️', b:'লজিক্যাল থিঙ্কিং'},
            {id:'pt', n:'Pattern', i:'🧩', b:'আইকিউ বুস্টার'},
            {id:'sd', n:'Sudoku', i:'🔢', b:'একাগ্রতা বৃদ্ধি'},
            {id:'ms', n:'Magic Square', i:'⬛', b:'ম্যাথ জিনিয়াস'},
            {id:'msn', n:'Missing No', i:'❓', b:'ধাঁধা সমাধান'},
            {id:'cmp', n:'Compare', i:'⚖️', b:'তুলনা করার দক্ষতা'},
            {id:'tm', n:'Time Travel', i:'⏰', b:'সময় সচেতনতা'},
            {id:'frx', n:'Fraction', i:'🍕', b:'পিজ্জা ম্যাথ'},
            {id:'sc', n:'Shape Count', i:'🔺', b:'জ্যামিতি মাস্টার'},
            {id:'mt', n:'Matchstick', i:'🕯️', b:'সমস্যা সমাধান'},
            {id:'mm', n:'Memory Match', i:'🧠', b:'ব্রেইন পাওয়ার'},
            {id:'kk', n:'Kakuro', i:'✖️', b:'সুপার ক্যালকুলেটর'},
            {id:'cb', n:'Code Breaker', i:'🔐', b:'সিক্রেট কোড'},
            {id:'sy', n:'Symmetry', i:'🌗', b:'চিত্রাঙ্কন মেধা'}
        ];

        let session = { players: [], currentPlayerIdx: 0, progress: {}, id: '' };
        let state = { isPremium: false };

        window.addEventListener('load', () => {
            session.id = getDeviceID();
            document.getElementById('device-id-txt').innerText = session.id;
            
            // ৩ডি অ্যানিমেশন রিস্টোর করার জন্য
            try { if(typeof ThreeEngine !== 'undefined') ThreeEngine.init(); } catch(e) { console.error("Engine failed."); }
            
            renderGrid();
            updateUI(session.id);
        });

        function renderGrid() {
            const grid = document.getElementById('game-grid');
            if(!grid) return; grid.innerHTML = ''; 
            GAMES_LIST.forEach((g, idx) => {
                const isLocked = !state.isPremium && idx !== 0; 
                grid.innerHTML += `
                    <div onclick="handleGameClick(${idx})" class="game-btn flex flex-col items-center">
                        ${isLocked ? '<span class="lock-icon">🔒</span>' : ''}
                        <span style="font-size: 2.2rem; margin-bottom: 0.5rem;">${g.i}</span>
                        <span style="font-size: 8px; font-weight: 900; color: white; text-transform: uppercase;">${g.n}</span>
                        <span style="font-size: 7px; color: var(--cyan); margin-top: 4px;">${g.b}</span>
                    </div>`;
            });
        }

        function getDeviceID() {
            let id = localStorage.getItem('mp_dev_id') || ('ID-' + Math.random().toString(36).substr(2, 6).toUpperCase());
            localStorage.setItem('mp_dev_id', id); return id;
        }

        function handleGameClick(idx) {
            if(!state.isPremium && idx !== 0) {
                alert("এই গেমটি আনলক করতে হোয়াটসঅ্যাপ করুন!");
            } else {
                showScreen('scr-setup');
            }
        }

        function showScreen(id) { document.querySelectorAll('#app > div').forEach(d => d.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
        function updateUI(id) { document.getElementById('cta-action').innerHTML = `<a href="https://wa.me/${WA_NUMBER}?text=Unlock ID: ${id}" style="display:inline-block; background:linear-gradient(to right,#06b6d4,#2563eb); color:white; padding:0.6rem 1.5rem; border-radius:1.5rem; text-decoration:none; font-weight:900; font-size:0.65rem;">আনলক করতে হোয়াটসঅ্যাপ করুন 🚀</a>`; }
    </script>
</body>
</html>
