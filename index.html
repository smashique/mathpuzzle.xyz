<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>mathpuzzle.xyz | Free</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen">
    <canvas id="bg-canvas"></canvas>
    
    <div id="main-menu" class="glass-ui animate__animated animate__fadeIn">
        <h1 class="text-4xl font-black mb-10 text-cyan-400 tracking-tighter text-center">mathpuzzle.xyz</h1>
        <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4"></div>
    </div>

    <div id="game-screen" class="hidden glass-ui p-10 max-w-2xl w-full text-center relative animate__animated animate__zoomIn">
        <div id="timer-display" class="absolute top-6 right-8 text-2xl font-black text-yellow-400">15s</div>
        <div id="level-tag" class="absolute top-6 left-8 text-xs font-bold uppercase tracking-widest text-cyan-400">Easy</div>
        
        <div id="puzzle-area" class="my-12 text-4xl font-black leading-relaxed">
            </div>

        <div id="mcq-grid" class="grid grid-cols-2 gap-4">
            </div>
    </div>

    <div id="lock-modal" class="modal-overlay hidden">
        <div class="bg-white/10 p-10 rounded-[3rem] backdrop-blur-3xl text-center border border-white/10">
            <span class="text-6xl">🔒</span>
            <h2 class="text-2xl font-bold mt-4">পাজলটি লক করা!</h2>
            <p class="text-slate-300 mb-6 text-sm">সবগুলো প্রিমিয়াম পাজল আনলক করতে আমাদের হোয়াটসঅ্যাপে মেসেজ দিন।</p>
            <button onclick="window.open('https://wa.me/8801303680618?text=Ami premium puzzles unlock korte chai')" class="bg-green-500 px-8 py-4 rounded-2xl font-black transition-all hover:bg-green-600">WhatsApp Message</button>
            <button onclick="document.getElementById('lock-modal').classList.add('hidden')" class="block w-full mt-4 text-sm text-slate-400">বন্ধ করুন</button>
        </div>
    </div>

    <script src="js/engine.js"></script>
    <script src="js/games/fruitMath.js"></script> 

    <script>
        const GAMES_LIST = [
            {id:'fr', n:'Fruit Math', i:'🍎'}, {id:'py', n:'Pyramid', i:'⛰️'},
            {id:'pt', n:'Pattern', i:'🧩'}, {id:'sd', n:'Sudoku', i:'🔢'},
            {id:'ms', n:'Magic Square', i:'⬛'}, {id:'msn', n:'Missing No', i:'❓'},
            {id:'cmp', n:'Compare', i:'⚖️'}, {id:'tm', n:'Time Travel', i:'⏰'},
            {id:'frx', n:'Fraction', i:'🍕'}, {id:'sh', n:'Shape Count', i:'🔺'},
            {id:'mc', n:'Matchstick', i:'🕯️'}, {id:'mem', n:'Memory', i:'🧠'},
            {id:'kk', n:'Kakuro', i:'✖️'}, {id:'cd', n:'Code Breaker', i:'🔐'},
            {id:'sy', n:'Symmetry', i:'🌓'}
        ];

        let countdown;
        let score = 0;

        window.addEventListener('load', () => {
            if (typeof ThreeEngine !== 'undefined') ThreeEngine.init();

            const grid = document.getElementById('game-grid');
            GAMES_LIST.forEach((g, idx) => {
                const isLocked = idx !== 0; 
                grid.innerHTML += `
                    <div onclick="${isLocked ? "document.getElementById('lock-modal').classList.remove('hidden')" : "initFruitGame()"}" 
                         class="game-card p-6 rounded-[2rem] flex flex-col items-center ${isLocked ? 'locked-card' : ''}">
                        <span class="text-4xl mb-2">${g.i}</span>
                        <span class="text-xs font-bold text-white tracking-wide">${g.n}</span>
                    </div>`;
            });
        });

        // গেম শুরু করার ফাংশন
        function initFruitGame() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            score = 0;
            FruitMath.level = 'easy';
            nextQuestion();
        }

        function nextQuestion() {
            clearInterval(countdown);
            const data = FruitMath.generate();
            
            document.getElementById('level-tag').innerText = FruitMath.level;
            document.getElementById('puzzle-area').innerHTML = data.question;
            
            const mcqGrid = document.getElementById('mcq-grid');
            mcqGrid.innerHTML = '';
            
            data.options.forEach(opt => {
                mcqGrid.innerHTML += `
                    <button onclick="handleAnswer(${opt})" class="bg-white/10 hover:bg-cyan-500 p-6 rounded-3xl text-2xl font-bold border border-white/10 transition-all active:scale-95">
                        ${opt}
                    </button>`;
            });

            startTimer();
        }

        function startTimer() {
            let time = 15;
            const display = document.getElementById('timer-display');
            display.innerText = time + "s";
            
            countdown = setInterval(() => {
                time--;
                display.innerText = time + "s";
                if(time <= 0) {
                    clearInterval(countdown);
                    gameOver("সময় শেষ! দ্রুত উত্তর দিতে হবে। ⏳");
                }
            }, 1000);
        }

        function handleAnswer(selected) {
            clearInterval(countdown);
            if(selected === FruitMath.answer) {
                score++;
                if(score >= 5) {
                    score = 0;
                    if(FruitMath.level === 'easy') FruitMath.level = 'medium';
                    else if(FruitMath.level === 'medium') FruitMath.level = 'hard';
                    alert("লেভেল আপ! পরবর্তী চ্যালেঞ্জ শুরু হচ্ছে। 🎉");
                }
                nextQuestion();
            } else {
                gameOver("ভুল উত্তর! আবার চেষ্টা করো। ❌");
            }
        }

        function gameOver(msg) {
            alert(msg);
            location.reload(); // একবারে সুযোগ শেষ হলে রিস্টার্ট
        }
    </script>
</body>
</html>
