<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Free Puzzle | mathpuzzle.xyz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen">
    <canvas id="bg-canvas"></canvas>

    <div class="max-w-5xl w-full glass-ui p-10 text-center relative">
        <h1 class="text-4xl font-black mb-8 text-cyan-400">mathpuzzle.xyz</h1>
        <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4"></div>
    </div>

    <div id="wa-modal" class="modal-overlay hidden">
        <div class="modal-box animate__animated animate__zoomIn">
            <span class="text-5xl">🔒</span>
            <h2 class="text-2xl font-bold mt-4 mb-2">পাজলটি লক করা!</h2>
            <p class="text-slate-300 mb-6 text-sm">সবগুলো প্রিমিয়াম পাজল আনলক করতে আমাদের হোয়াটসঅ্যাপে মেসেজ দিন।</p>
            
            <div class="flex flex-col gap-3">
                <button onclick="sendWaMsg()" class="bg-green-500 hover:bg-green-600 p-4 rounded-2xl font-black flex items-center justify-center gap-2 transition-all">
                    <span>💬 WhatsApp এ মেসেজ দিন</span>
                </button>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-sm mt-2">পরে খেলবো</button>
            </div>
        </div>
    </div>

    <script src="js/engine.js"></script>
    <script>
        const GAMES = [
            {id:'fr', n:'Fruit Math', i:'🍎'}, {id:'py', n:'Pyramid', i:'⛰️'},
            {id:'pt', n:'Pattern', i:'🧩'}, {id:'sd', n:'Sudoku', i:'🔢'},
            {id:'ms', n:'Magic Square', i:'⬛'}, {id:'msn', n:'Missing No', i:'❓'},
            {id:'cmp', n:'Compare', i:'⚖️'}, {id:'tm', n:'Time Travel', i:'⏰'},
            {id:'frx', n:'Fraction', i:'🍕'}, {id:'sh', n:'Shape Count', i:'🔺'},
            {id:'mc', n:'Matchstick', i:'🕯️'}, {id:'mem', n:'Memory', i:'🧠'},
            {id:'kk', n:'Kakuro', i:'✖️'}, {id:'cd', n:'Code Breaker', i:'🔐'},
            {id:'sy', n:'Symmetry', i:'🌓'}
        ];

        window.onload = () => {
            if(typeof ThreeEngine !== 'undefined') ThreeEngine.init();

            const grid = document.getElementById('game-grid');
            GAMES.forEach((g, idx) => {
                const isLocked = idx !== 0;
                const card = document.createElement('div');
                card.className = `game-card p-6 rounded-3xl flex flex-col items-center shadow-lg ${isLocked ? 'locked-card' : ''}`;
                card.innerHTML = `<span class="text-4xl mb-2">${g.i}</span><span class="text-xs font-bold text-white">${g.n}</span>`;
                
                card.onclick = () => {
                    if(isLocked) {
                        showModal(); // Sorasori na giye popup dekhabe
                    } else {
                        alert(g.n + " khela shuru hochhe!");
                    }
                };
                grid.appendChild(card);
            });
        };

        function showModal() {
            document.getElementById('wa-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('wa-modal').classList.add('hidden');
        }

        function sendWaMsg() {
            const waLink = "https://wa.me/8801303680618?text=Ami mathpuzzle.xyz er premium puzzles unlock korte chai. Link o Number din.";
            window.open(waLink, '_blank');
            closeModal();
        }
    </script>
</body>
</html>
