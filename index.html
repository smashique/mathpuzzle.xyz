<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>mathpuzzle.xyz | ব্রেইন বুস্টার ৩ডি</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* ৩ নম্বর ছবির সমস্যা সমাধানের জন্য এখানে ডিজাইন দেওয়া হলো */
        body { margin: 0; background: #000; color: white; font-family: sans-serif; }
        
        /* ফ্রেমটি পুরোপুরি স্বচ্ছ করার লজিক */
        .floating-ui {
            background: rgba(255, 255, 255, 0.05) !important; /* মাত্র ৫% অপাসিটি */
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 3rem;
        }

        .game-btn {
            background: rgba(255, 255, 255, 0.03) !important;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .game-btn:hover:not(.opacity-30) {
            transform: scale(1.05) translateY(-5px);
            background: rgba(6, 182, 212, 0.2) !important;
            border-color: rgba(6, 182, 212, 0.5);
        }

        .download-btn {
            background: linear-gradient(45deg, #06b6d4, #8b5cf6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen bg-black overflow-hidden">
    <canvas id="render-canvas" class="fixed top-0 left-0 -z-10 w-full h-full"></canvas>

    <div id="app" class="max-w-6xl w-full floating-ui p-6 sm:p-10 relative animate__animated animate__fadeIn">
        <div id="scr-menu">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-8 px-4 text-center sm:text-left">
                <div>
                    <h1 class="text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500 mb-2">mathpuzzle.xyz</h1>
                    <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">স্মার্ট বাচ্চাদের জন্য লজিক্যাল ৩ডি গেম</p>
                </div>
                <button onclick="installApp()" class="download-btn px-8 py-3 rounded-2xl text-[10px] font-black text-white uppercase">📥 অ্যাপটি সেভ করুন</button>
            </div>
            
            <div id="status-area" class="flex justify-center mb-6">
                <div id="status-badge" class="px-6 py-2 rounded-full text-[10px] font-bold tracking-widest border border-white/10 uppercase">যাচাই করা হচ্ছে...</div>
            </div>

            <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4 mb-8"></div>
            
            <div id="id-display" class="p-6 rounded-[30px] text-center border border-white/5 bg-transparent">
                <p class="text-[9px] text-slate-400 font-bold uppercase mb-2">আপনার ডিভাইস আইডি</p>
                <h3 id="device-id-txt" class="text-2xl font-black text-white tracking-widest mb-4">LOADING...</h3>
                <div id="cta-action"></div>
            </div>
        </div>
        </div>

    <script src="js/engine.js"></script>
    <script src="js/games/fruitMath.js"></script>
    <script src="js/games/pyramidMath.js"></script>
    <script src="js/games/patternMath.js"></script>
    <script src="js/games/sudokuMath.js"></script>
    <script src="js/games/magicSquare.js"></script>
    <script src="js/games/missingNo.js"></script> <script>
        // আপনার জাভাস্ক্রিপ্ট লজিক এখানে থাকবে...
        // গেম লিস্টে ৬ নম্বর গেমটি যুক্ত করতে ভুলবেন না।
    </script>
</body>
</html>
