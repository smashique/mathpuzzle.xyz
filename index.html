<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>mathpuzzle.xyz | Free</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    
    <div class="glass-ui">
        <h1 class="text-4xl font-black mb-10 text-cyan-400 tracking-tighter">mathpuzzle.xyz</h1>
        <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4"></div>
    </div>

    <div id="lock-modal" class="modal-overlay hidden">
        <div class="bg-white/10 p-10 rounded-[3rem] backdrop-blur-3xl text-center border border-white/10">
            <span class="text-6xl">🔒</span>
            <h2 class="text-2xl font-bold mt-4">পাজলটি লক করা!</h2>
            <p class="text-slate-300 mb-6">আনলক করতে আমাদের হোয়াটসঅ্যাপে মেসেজ দিন।</p>
            <button onclick="window.open('https://wa.me/8801303680618')" class="bg-green-500 px-8 py-4 rounded-2xl font-black">WhatsApp Message</button>
            <button onclick="document.getElementById('lock-modal').classList.add('hidden')" class="block w-full mt-4 text-sm text-slate-400">বন্ধ করুন</button>
        </div>
    </div>

    <script src="js/engine.js"></script>
    <script>
        const GAMES = [
            {id:'fr', n:'Fruit Math', i:'🍎'}, {id:'py', n:'Pyramid', i:'⛰️'},
            {id:'pt', n:'Pattern', i:'🧩'}, {id:'sd', n:'Sudoku', i:'🔢'},
            {id:'ms', n:'Magic Square', i:'⬛'}, {id:'msn', n:'Missing No', i:'❓'},
            {id:'cmp', n:'Compare', i:'⚖️'}, {id:'tm', n:'Time Travel', i:'⏰'},
            {id:'frx', n:'Fraction', i:'🍕'}, {id:'sh', n:'Shape Count', i:'🔺'},
            {id:'mc', n:'Matchstick', i:'🕯️'}, {id:'mem', n:'Memory', i:'🧠'},
            {id:'kk', n:'Kakuro', i:'✖️'}, {id:'cd', n:'Code Breaker', i:'🔐'},
            {id:'sy', n:'Symmetry', i:'🌓'}
        ];

        window.onload = () => {
            ThreeEngine.init();
            const grid = document.getElementById('game-grid');
            GAMES.forEach((g, idx) => {
                const isLocked = idx !== 0; // ১ম টি ছাড়া সব লক
                grid.innerHTML += `
                    <div onclick="${isLocked ? "document.getElementById('lock-modal').classList.remove('hidden')" : "alert('খেলুন!')"}" 
                         class="game-card p-6 rounded-[2rem] flex flex-col items-center ${isLocked ? 'locked-card' : ''}">
                        <span class="text-4xl mb-2">${g.i}</span>
                        <span class="text-xs font-bold text-white tracking-wide">${g.n}</span>
                    </div>`;
            });
        };
    </script>
    <script src="js/engine.js"></script>
<script>
    window.addEventListener('load', () => {
        // লাইব্রেরি লোড হওয়ার পর ইঞ্জিন চালু করা
        if (typeof THREE !== 'undefined' && typeof ThreeEngine !== 'undefined') {
            ThreeEngine.init();
        } else {
            console.error("Three.js or Engine.js not loaded!");
        }
    });
</script>
</body>
</html>
