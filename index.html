<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>mathpuzzle.xyz | Free</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen">
    <canvas id="bg-canvas"></canvas>
    
    <div id="main-menu" class="glass-ui animate__animated animate__fadeIn">
        <h1 class="text-4xl font-black mb-10 text-cyan-400 tracking-tighter text-center">mathpuzzle.xyz</h1>
        <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4"></div>
    </div>

    <div id="info-screen" class="hidden glass-ui p-8 max-w-lg w-full text-center animate__animated animate__fadeIn">
        <h2 class="text-2xl font-bold mb-6 text-cyan-400">Player Information</h2>
        <input type="number" id="player-number" placeholder="Player Number" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 mb-4 text-center outline-none focus:border-cyan-400">
        <input type="text" id="player-name" placeholder="Player Name" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 mb-6 text-center outline-none focus:border-cyan-400">
        <button onclick="showAgeCategory()" class="w-full bg-cyan-600 py-4 rounded-2xl font-black hover:bg-cyan-500 transition-all">Next Step</button>
    </div>

    <div id="age-screen" class="hidden glass-ui p-8 max-w-lg w-full text-center animate__animated animate__fadeIn">
        <h2 class="text-2xl font-bold mb-6 text-cyan-400">How old are you?</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-8">
            <button onclick="startGameWithAge('4-5')" class="bg-white/5 border border-white/10 p-3 rounded-xl text-xs hover:bg-cyan-500 transition-all">4-5 Years</button>
            <button onclick="startGameWithAge('6-7')" class="bg-white/5 border border-white/10 p-3 rounded-xl text-xs hover:bg-cyan-500 transition-all">6-7 Years</button>
            <button onclick="startGameWithAge('8-9')" class="bg-white/5 border border-white/10 p-3 rounded-xl text-xs hover:bg-cyan-500 transition-all">8-9 Years</button>
            <button onclick="startGameWithAge('10-11')" class="bg-white/5 border border-white/10 p-3 rounded-xl text-xs hover:bg-cyan-500 transition-all">10-11 Years</button>
            <button onclick="startGameWithAge('12+')" class="bg-white/5 border border-white/10 p-3 rounded-xl text-xs hover:bg-cyan-500 transition-all">12+ Years</button>
        </div>
        <p class="text-[10px] text-slate-400">Puzzles are based on your age category</p>
    </div>

    <div id="game-screen" class="hidden glass-ui p-10 max-w-2xl w-full text-center relative animate__animated animate__zoomIn">
        <div id="timer-display" class="absolute top-6 right-8 text-2xl font-black text-yellow-400">15s</div>
        <div id="level-tag" class="absolute top-6 left-8 text-xs font-bold uppercase tracking-widest text-cyan-400">Easy</div>
        <div id="puzzle-area" class="my-12 text-4xl font-black leading-relaxed"></div>
        <div id="mcq-grid" class="grid grid-cols-2 gap-4"></div>
    </div>

    <div id="lock-modal" class="modal-overlay hidden">
        <div class="bg-white/10 p-10 rounded-[3rem] backdrop-blur-3xl text-center border border-white/10">
            <span class="text-6xl">🔒</span>
            <h2 class="text-2xl font-bold mt-4">Puzzle Locked!</h2>
            <button onclick="window.open('https://wa.me/8801303680618')" class="bg-green-500 px-8 py-4 rounded-2xl font-black mt-6">WhatsApp Message</button>
            <button onclick="document.getElementById('lock-modal').classList.add('hidden')" class="block w-full mt-4 text-xs text-slate-400">Close</button>
        </div>
    </div>

    <script src="js/engine.js"></script>
    <script src="js/games/fruitMath.js"></script>
    <script>
        const GAMES_LIST = [
            {id:'fr', n:'Fruit Math', i:'🍎'}, {id:'py', n:'Pyramid', i:'⛰️'},
            {id:'pt', n:'Pattern', i:'🧩'}, {id:'sd', n:'Sudoku', i:'🔢'},
            {id:'ms', n:'Magic Square', i:'⬛'}, {id:'msn', n:'Missing No', i:'❓'},
            {id:'cmp', n:'Compare', i:'⚖️'}, {id:'tm', n:'Time Travel', i:'⏰'},
            {id:'frx', n:'Fraction', i:'🍕'}, {id:'sh', n:'Shape Count', i:'🔺'},
            {id:'mc', n:'Matchstick', i:'🕯️'}, {id:'mem', n:'Memory', i:'🧠'},
            {id:'kk', n:'Kakuro', i:'✖️'}, {id:'cd', n:'Code Breaker', i:'🔐'},
            {id:'sy', n:'Symmetry', i:'🌓'}
        ];

        let selectedGameId = null, countdown, score = 0;

        window.addEventListener('load', () => {
            if (typeof ThreeEngine !== 'undefined') ThreeEngine.init();
            const grid = document.getElementById('game-grid');
            GAMES_LIST.forEach((g, idx) => {
                const isLocked = idx !== 0; 
                grid.innerHTML += `
                    <div onclick="selectGame('${g.id}', ${isLocked})" 
                         class="game-card p-6 rounded-[2rem] flex flex-col items-center ${isLocked ? 'locked-card' : ''}">
                        <span class="text-4xl mb-2">${g.i}</span>
                        <span class="text-xs font-bold text-white tracking-wide">${g.n}</span>
                    </div>`;
            });
        });

        function selectGame(id, locked) {
            if(locked) {
                document.getElementById('lock-modal').classList.remove('hidden');
            } else {
                selectedGameId = id;
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('info-screen').classList.remove('hidden');
            }
        }

        function showAgeCategory() {
            const num = document.getElementById('player-number').value;
            const name = document.getElementById('player-name').value;
            if(!num || !name) return alert("Please fill in all details! 😊");
            document.getElementById('info-screen').classList.add('hidden');
            document.getElementById('age-screen').classList.remove('hidden');
        }

        function startGameWithAge(age) {
            document.getElementById('age-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            const levelMap = {'4-5': 'easy', '6-7': 'easy-medium', '8-9': 'medium', '10-11': 'medium-hard', '12+': 'hard'};
            FruitMath.level = levelMap[age];
            score = 0;
            nextQuestion();
        }

        function nextQuestion() {
            clearInterval(countdown);
            const data = FruitMath.generate();
            document.getElementById('level-tag').innerText = FruitMath.level;
            document.getElementById('puzzle-area').innerHTML = data.question;
            const mcqGrid = document.getElementById('mcq-grid');
            mcqGrid.innerHTML = '';
            data.options.forEach(opt => {
                mcqGrid.innerHTML += `<button onclick="handleAnswer(${opt})" class="bg-white/10 hover:bg-cyan-500 p-6 rounded-3xl text-2xl font-bold border border-white/10 transition-all active:scale-95">${opt}</button>`;
            });
            startTimer();
        }

        function startTimer() {
            let time = 15;
            const display = document.getElementById('timer-display');
            display.innerText = time + "s";
            countdown = setInterval(() => {
                time--; display.innerText = time + "s";
                if(time <= 0) { clearInterval(countdown); gameOver("Time's Up! Be faster next time. ⏳"); }
            }, 1000);
        }

        function handleAnswer(selected) {
            if(selected === FruitMath.answer) {
                score++;
                if(score >= 5) {
                    score = 0;
                    const levels = ['easy', 'easy-medium', 'medium', 'medium-hard', 'hard'];
                    let idx = levels.indexOf(FruitMath.level);
                    if(idx < levels.length - 1) FruitMath.level = levels[idx+1];
                    alert("Level Up! 🎉");
                }
                nextQuestion();
            } else { gameOver("Wrong Answer! Game Over. ❌"); }
        }

        function gameOver(msg) { alert(msg); location.reload(); }
    </script>
</body>
</html>
