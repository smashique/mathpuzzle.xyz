<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mathpuzzle.xyz | ৩ডি লার্নিং প্ল্যাটফর্ম</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* */
        :root { --cyan: #22d3ee; --fuchsia: #d946ef; --slate: #94a3b8; }
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        
        /* ১) ফ্রেম ট্রান্সপারেন্ট করা */
        .floating-ui { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(30px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 3rem; padding: 2rem;
            max-height: 90vh; overflow-y: auto;
        }

        .game-btn { 
            background: rgba(255, 255, 255, 0.03) !important; /* ট্রান্সপারেন্ট ফ্রেম */
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 1.5rem; padding: 1rem; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .game-btn:hover { background: rgba(34, 211, 238, 0.1) !important; transform: scale(1.05); }

        .input-box { background: rgba(255,255,255,0.05); border: 1px solid var(--cyan); border-radius: 1rem; padding: 1rem; color: white; width: 100%; margin-bottom: 1rem; }
        .primary-btn { background: linear-gradient(45deg, var(--cyan), var(--fuchsia)); border: none; padding: 1rem 2rem; border-radius: 1.5rem; color: white; font-weight: 900; cursor: pointer; width: 100%; }
        
        .hidden { display: none !important; }
        #render-canvas { position: fixed; top: 0; left: 0; z-index: -10; width: 100%; height: 100%; }
        
        .progress-card { background: rgba(34, 211, 238, 0.1); border-radius: 1rem; padding: 1rem; margin-top: 1rem; font-size: 0.8rem; }
        .hint-box { background: rgba(217, 70, 239, 0.1); border-left: 4px solid var(--fuchsia); padding: 0.8rem; margin: 1rem 0; font-size: 0.9rem; color: #fdf4ff; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <canvas id="render-canvas"></canvas>

    <div id="app" class="max-w-4xl w-full floating-ui relative">
        <div id="scr-setup">
            <h1 class="text-center" style="color: var(--cyan);">কয়জন খেলতে চাও?</h1>
            <div class="grid grid-cols-3 gap-4 mb-8">
                <button onclick="setPlayers(1)" class="game-btn">1 জন</button>
                <button onclick="setPlayers(2)" class="game-btn">2 জন</button>
                <button onclick="setPlayers(3)" class="game-btn">3 জন</button>
            </div>
            
            <div id="name-inputs" class="hidden">
                <h2 id="name-heading" class="text-center">খেলোয়াড়দের নাম লেখো</h2>
                <div id="input-container"></div>
                <h2 class="text-center" style="color: var(--fuchsia);">তোমার বয়স কত?</h2>
                <select id="age-range" class="input-box">
                    <option value="4-6">4-6 বছর (সহজ)</option>
                    <option value="7-9">7-9 বছর (মাঝারি)</option>
                    <option value="10-13">10-13 বছর (কঠিন)</option>
                </select>
                <button onclick="startJourney()" class="primary-btn">যাত্রা শুরু করো 🚀</button>
            </div>
        </div>

        <div id="scr-menu" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 id="welcome-msg" class="text-gradient"></h2>
                <div id="user-id-top" style="font-size: 10px; opacity: 0.6;"></div>
            </div>
            <div id="guardian-portal" class="progress-card">
                <b>গার্ডিয়ান পোর্টাল:</b> বাচ্চার অগ্রগতি - <span id="progress-val">0%</span>
            </div>
            <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-5 gap-4 mt-6"></div>
        </div>

        <div id="scr-engine" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <div id="player-turn" style="color: var(--cyan); font-weight: 900;"></div>
                <div id="clock-txt" style="color: #ef4444; font-size: 2rem; font-weight: 900;">15.0</div>
            </div>
            <div id="inst-hint" class="hint-box"></div>
            <div id="puzzle-stage" style="min-height: 200px; font-size: 3rem; text-align: center; margin: 2rem 0;"></div>
            <div id="mcq-grid" class="grid grid-cols-2 gap-4"></div>
            <button onclick="levelUp()" id="lvl-up-btn" class="hidden mt-4" style="background: var(--fuchsia); padding: 0.5rem; border-radius: 1rem; border: none; color: white;">লেভেল আপ করুন ⬆️</button>
        </div>
    </div>

    <script src="js/engine.js"></script>
    <script src="js/games/fruitMath.js"></script>
    <script>
        const WA_NUMBER = "8801303680618";
        // ৪) প্রোবাবিলিটি কন্ট্রোল লজিক
        const P_SALT = () => Math.random().toString(36).substring(7) + Date.now();
        
        let session = {
            players: [],
            currentPlayerIdx: 0,
            ageRange: '4-6',
            progress: {},
            id: ''
        };

        // ২) প্লেয়ার সেটআপ
        function setPlayers(num) {
            const container = document.getElementById('input-container');
            container.innerHTML = '';
            for(let i=1; i<=num; i++) {
                container.innerHTML += `<input type="text" id="p-name-${i}" placeholder="প্লেয়ার ${i} এর নাম" class="input-box">`;
            }
            document.getElementById('name-inputs').classList.remove('hidden');
        }

        function startJourney() {
            const inputs = document.querySelectorAll('#input-container input');
            session.players = Array.from(inputs).map(inp => ({ name: inp.value || 'Player', score: 0, level: 1 }));
            session.ageRange = document.getElementById('age-range').value;
            session.id = getDeviceID();
            
            // ৮) প্রোগ্রেস লোড করা
            const saved = localStorage.getItem('mp_progress_' + session.id);
            if(saved) session.progress = JSON.parse(saved);

            showScreen('scr-menu');
            document.getElementById('welcome-msg').innerText = `স্বাগতম, ${session.players[0].name}!`;
            document.getElementById('user-id-top').innerText = `ID: ${session.id}`;
            renderGrid();
            updateProgressUI();
        }

        // ৮) প্রোগ্রেস সেভ করা
        function saveProgress() {
            localStorage.setItem('mp_progress_' + session.id, JSON.stringify(session.progress));
            updateProgressUI();
        }

        function updateProgressUI() {
            const totalGames = 15;
            const completed = Object.keys(session.progress).length;
            const percent = Math.round((completed / totalGames) * 100);
            document.getElementById('progress-val').innerText = percent + '%';
        }

        // ৬) গেম ইনস্ট্রাকশন
        const GAME_HINTS = {
            fr: "সঠিক ফলের মান বের করে প্রশ্নবোধক চিহ্নে বসাও।",
            py: "পিরামিডের নিচের দুটি সংখ্যার যোগফল হবে ওপরের সংখ্যা।",
            cb: "লুকানো কোডটি খুঁজে বের করার চেষ্টা করো।"
            // অন্যান্য গেমের হিন্ট...
        };

        function selectPuzzle(id, locked) {
            if(locked) { window.location.href = `https://wa.me/${WA_NUMBER}?text=Unlock ID: ${session.id}`; return; }
            state.gameId = id;
            document.getElementById('inst-hint').innerText = "নির্দেশনা: " + (GAME_HINTS[id] || "মনোযোগ দিয়ে সমাধান করো।");
            document.getElementById('player-turn').innerText = "খেলছে: " + session.players[session.currentPlayerIdx].name;
            showScreen('scr-engine');
            nextPuzzle();
        }

        // ৪) প্রোবাবিলিটি বুস্ট (Permutation & Unique ID logic)
        function getUniqueSeed() {
            return btoa(P_SALT()).substring(0, 16);
        }

        // ৩) লেভেল আপ লজিক
        function levelUp() {
            const p = session.players[session.currentPlayerIdx];
            p.level++;
            alert(`অভিনন্দন! তুমি এখন লেভেল ${p.level}-এ!`);
            nextPuzzle();
        }

        function checkAns(val) {
            // ... অ্যানসার চেকিং লজিক ...
            if(val == correctAns) {
                session.progress[state.gameId] = true;
                saveProgress();
                // নেক্সট প্লেয়ার টার্ন (মাল্টিপ্লেয়ার ফিক্স)
                session.currentPlayerIdx = (session.currentPlayerIdx + 1) % session.players.length;
                // ... কনফেটি ও সাউন্ড ...
            }
        }

        function getDeviceID() {
            let id = localStorage.getItem('mp_dev_id') || ('ID-' + Math.random().toString(36).substr(2, 6).toUpperCase());
            localStorage.setItem('mp_dev_id', id);
            return id;
        }
        function showScreen(id) { document.querySelectorAll('#app > div').forEach(d => d.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
    </script>
</body>
</html>
