        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS2geQz6QVkVrAYDhVY3WWKrD7MK1RoHna3nb3NpANiTd-RX24I_xmfTzgbnK4sC1Y8yu7eXSoyanZO/pub?output=csv"; 
        
        let state = { gameId:'', pCount:1, names:[], age:'', turn:0, score:0, levelPoints:0, timer:15, interval:null, isPremium: false };

        window.addEventListener('load', async () => {
            ThreeEngine.init();
            const devID = getDeviceID();
            document.getElementById('device-id-txt').innerText = devID;
            state.isPremium = await checkMembership(devID);
            updateUI(devID);

        });

        function getDeviceID() {
            let id = localStorage.getItem('mp_dev_id') || ('ID-' + Math.random().toString(36).substr(2, 6).toUpperCase());
            localStorage.setItem('mp_dev_id', id);
            return id;
        }

        async function checkMembership(id) {
            try {
                const res = await fetch(SHEET_CSV_URL);
                const csv = await res.text();
                const rows = csv.split('\n');
                for(let i=1; i<rows.length; i++) {
                    const columns = rows[i].split(',');
                    if(columns[1]?.trim() === id) {
                        const regDate = new Date(columns[0]?.trim());
                        const duration = parseInt(columns[2]?.trim()) || 0;
                        const expiry = new Date(regDate);
                        expiry.setDate(expiry.getDate() + duration);
                        if(new Date() < expiry) return true;
                    }
                }
            } catch(e) { console.error("Sync Error"); }
            return false;
        }

        function updateUI(id) {
            const badge = document.getElementById('status-badge');
            const ctaZone = document.getElementById('cta-action');
            if(state.isPremium) {
                badge.innerHTML = "PREMIUM ACTIVE ✅";
                badge.className = "px-6 py-1.5 rounded-full text-[9px] font-black border border-cyan-500/30 text-cyan-400 uppercase tracking-widest";
                ctaZone.innerHTML = `<a href="https://wa.me/${WA_NUMBER}?text=Hi, Help needed for ID: ${id}" class="bg-green-600/20 text-green-400 border border-green-600/30 px-8 py-3 rounded-2xl font-bold text-xs">Developer Support (WhatsApp)</a>`;
            } else {
                badge.innerHTML = "FREE VERSION 🎁";
                ctaZone.innerHTML = `<a href="https://wa.me/${WA_NUMBER}?text=Unlock all 15 games for ID: ${id}" class="bg-gradient-to-r from-cyan-500 to-blue-600 text-white px-10 py-4 rounded-2xl font-black text-xs shadow-lg">আনলক করুন ১৫টি গেম 🚀</a>`;
            }
        }

                        <span class="text-[8px] font-black text-white uppercase tracking-tighter">${isLocked ? 'Locked' : g.n}</span>
