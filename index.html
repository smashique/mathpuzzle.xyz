<!DOCTYPE html>
<html lang="en">
<head>

<body class="flex items-center justify-center p-4 min-h-screen bg-black overflow-hidden font-sans">
    <canvas id="render-canvas" class="fixed top-0 left-0 -z-10 w-full h-full"></canvas>

    <div id="app" class="max-w-6xl w-full floating-ui p-6 sm:p-8 relative animate__animated animate__fadeIn">
        
        <div id="scr-menu">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-2 mb-4 px-4 text-center sm:text-left">
                <div>
                    <h1 class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500 tracking-tight">mathpuzzle.xyz</h1>
                    <p class="text-slate-400 text-[9px] font-bold uppercase tracking-widest">স্মার্ট বাচ্চাদের জন্য ৩ডি গেম</p>
                </div>
                
                <div class="flex flex-col items-center sm:items-end gap-1">
                    <button onclick="installApp()" class="download-btn px-6 py-2 rounded-xl text-[9px] font-black text-white uppercase tracking-wider transition-all">
                        📥 অ্যাপটি সেভ করুন
                    </button>
                    <p class="text-[8px] text-cyan-400 font-bold italic">লিঙ্ক হারানোর ভয় নেই, সরাসরি খেলুন!</p>
                </div>
            </div>
            
            <div class="flex justify-center mb-4">
                <div id="status-badge" class="px-6 py-1.5 rounded-full text-[9px] font-black tracking-[0.2em] transition-all duration-500 uppercase">
                    Loading License...
                </div>
            </div>

            <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 mb-4"></div>
            
            <div id="id-display" class="flex flex-col items-center p-4 sm:p-6 rounded-[30px] text-center border border-white/5 bg-transparent">
                <div class="inline-block px-3 py-0.5 rounded-full bg-white/5 text-[8px] text-slate-400 font-bold uppercase mb-2 tracking-widest">
                    ডিভাইস আইডি
                </div>
                <h3 id="device-id-txt" class="text-2xl sm:text-3xl font-black text-white tracking-widest mb-4">LOADING...</h3>
                
                <div id="cta-action" class="flex flex-col items-center w-full max-w-sm">
                    </div>
            </div>
        </div>

        </div>

    <script src="js/engine.js"></script>
    <script src="js/games/fruitMath.js"></script>
    <script src="js/games/pyramidMath.js"></script>
    <script src="js/games/patternMath.js"></script>
    <script src="js/games/sudokuMath.js"></script>
    <script src="js/games/magicSquare.js"></script> <script>
        // ... getDeviceID, checkMembership functions ...
        
        function launchEngine(age) {
            state.age = age;
            const levelMap = {'4-5':'easy', '6-7':'easy-medium', '8-9':'medium', '10-11':'medium-hard', '12-13':'hard', '14+':'hard'};
            // ৫টি গেমের লেভেল সেট
            FruitMath.level = PyramidMath.level = PatternMath.level = SudokuMath.level = MagicSquare.level = levelMap[age];
            showScreen('scr-engine'); nextPuzzle();
        }

        function nextPuzzle() {
            clearInterval(state.interval);
            let data;
            if(state.gameId === 'fr') data = FruitMath.generate();
            else if(state.gameId === 'py') data = PyramidMath.generate();
            else if(state.gameId === 'pt') data = PatternMath.generate();
            else if(state.gameId === 'sd') data = SudokuMath.generate();
            else if(state.gameId === 'ms') data = MagicSquare.generate(); // ৫ নম্বর গেম লোড
            
            document.getElementById('puzzle-stage').innerHTML = data.question;
            // ... rest of MCQ code ...
        }

        function checkAns(val) {
            clearInterval(state.interval);
            let ans;
            if(state.gameId === 'fr') ans = FruitMath.answer;
            else if(state.gameId === 'py') ans = PyramidMath.answer;
            else if(state.gameId === 'pt') ans = PatternMath.answer;
            else if(state.gameId === 'sd') ans = SudokuMath.answer;
            else if(state.gameId === 'ms') ans = MagicSquare.answer;
            // ... rest of result check code ...
        }
    </script>
