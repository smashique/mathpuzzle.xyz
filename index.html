<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mathpuzzle.xyz | ৩ডি ব্রেইন বুস্টার</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* */
        :root { --cyan: #22d3ee; --fuchsia: #d946ef; --slate: #94a3b8; }
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        .flex { display: flex; } .items-center { align-items: center; } .justify-center { justify-content: center; }
        .flex-col { flex-direction: column; } .text-center { text-align: center; } .relative { position: relative; }
        .grid { display: grid; } .gap-4 { gap: 1rem; } .mb-6 { margin-bottom: 1.5rem; }
        .min-h-screen { min-height: 100vh; } .w-full { width: 100%; } .max-w-6xl { max-width: 72rem; }

        /* ট্রান্সপারেন্ট গ্লাস-মরফিক ডিজাইন */
        .floating-ui { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 3rem; 
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-height: 90vh;
            overflow-y: auto;
        }

        .id-bar {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .game-btn { 
            background: rgba(255, 255, 255, 0.05) !important; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 1.5rem; 
            padding: 1rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .game-btn:hover { transform: scale(1.05) translateY(-5px); background: rgba(34, 211, 238, 0.1) !important; border-color: var(--cyan); }
        
        .lock-icon { position: absolute; top: 10px; right: 10px; font-size: 12px; filter: grayscale(1); opacity: 0.6; }

        .download-btn { 
            background: linear-gradient(45deg, var(--cyan), var(--fuchsia)); 
            border: none; color: white; padding: 0.5rem 1rem; border-radius: 0.75rem;
            font-weight: 900; text-transform: uppercase; cursor: pointer;
            animation: pulse 2s infinite; font-size: 0.6rem;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        
        .text-gradient { background: linear-gradient(to right, var(--cyan), var(--fuchsia)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hidden { display: none !important; }
        #render-canvas { position: fixed; top: 0; left: 0; z-index: -10; width: 100%; height: 100%; }
        
        /* বেনিফিট মডাল (পপ-আপ) */
        #benefit-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 1000; background: rgba(0, 0, 0, 0.9); border: 1px solid var(--cyan);
            padding: 30px; border-radius: 40px; width: 90%; max-width: 380px;
            backdrop-filter: blur(25px); box-shadow: 0 0 50px rgba(34, 211, 238, 0.3);
        }

        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        @media (min-width: 640px) { .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (min-width: 768px) { .grid-cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <canvas id="render-canvas"></canvas>

    <div id="app" class="max-w-6xl w-full floating-ui relative animate__animated animate__fadeIn">
        <div id="scr-menu">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6">
                <div class="text-center sm:text-left">
                    <h1 class="text-gradient" style="font-size: 2rem; font-weight: 900; margin: 0;">mathpuzzle.xyz</h1>
                    <p style="color: var(--slate); font-size: 9px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.1em;">স্মার্ট বাচ্চাদের লজিক্যাল ৩ডি গেম</p>
                </div>
                <button onclick="installApp()" class="download-btn">📥 অ্যাপটি সেভ করুন</button>
            </div>

            <div class="id-bar">
                <p style="font-size: 8px; color: var(--slate); font-weight: bold; text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.2em;">আপনার ইউনিক ডিভাইস আইডি</p>
                <h3 id="device-id-txt" style="font-size: 1.2rem; font-weight: 900; margin: 0.5rem 0; letter-spacing: 0.2em; color: white;">---</h3>
                <div id="cta-action"></div>
            </div>
            
            <div id="game-grid" class="grid grid-cols-2 gap-4 mb-8"></div>
        </div>

        <div id="scr-engine" class="hidden">
            <div class="flex justify-between items-center mb-8 px-4">
                <div id="turn-txt" style="color: var(--cyan); font-weight: 900;">Turn: -</div>
                <div id="clock-txt" style="color: #ef4444; font-size: 2.5rem; font-family: monospace; font-weight: 900;">15.0</div>
            </div>
            <div id="puzzle-stage" class="flex flex-col items-center justify-center" style="min-height: 250px; font-size: 3rem; font-weight: 900; margin-bottom: 2rem; text-align: center;"></div>
            <div id="mcq-grid" class="grid grid-cols-2 gap-4" style="max-width: 450px; margin: 0 auto;"></div>
        </div>
    </div>

    <script src="js/engine.js"></script>
    <script src="js/games/fruitMath.js"></script>
    <script src="js/games/pyramidMath.js"></script>
    <script src="js/games/patternMath.js"></script>
    <script src="js/games/sudokuMath.js"></script>
    <script src="js/games/magicSquare.js"></script>
    <script src="js/games/missingNo.js"></script>
    <script src="js/games/compareMath.js"></script>
    <script src="js/games/timeTravel.js"></script>
    <script src="js/games/fractionMath.js"></script>
    <script src="js/games/shapeCount.js"></script>
    <script src="js/games/matchstick.js"></script>
    <script src="js/games/memoryMatch.js"></script>
    <script src="js/games/kakuroMath.js"></script>
    <script src="js/games/codeBreaker.js"></script>
    <script src="js/games/symmetry.js"></script>

    <script>
        /* নিউরো-মার্কেটিং ডেটা সেট */
        const WA_NUMBER = "8801303680618";
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS2geQz6QVkVrAYDhVY3WWKrD7MK1RoHna3nb3NpANiTd-RX24I_xmfTzgbnK4sC1Y8yu7eXSoyanZO/pub?output=csv"; 
        
        const GAMES_LIST = [
            {id:'fr', n:'Fruit Math', i:'🍎', b:'বুদ্ধি বাড়ে ১০০%', u:'ফল দিয়ে বুদ্ধির লড়াই! এটি খেললে বাচ্চার গণিতের ভয় কাটবে এবং দ্রুত হিসাব করার ক্ষমতা বাড়বে।'},
            {id:'py', n:'Pyramid', i:'⛰️', b:'লজিক্যাল থিঙ্কিং', u:'পিরামিড পাজল সমাধান করলে বাচ্চার ব্রেইন কানেকশন মজবুত হয় এবং গভীর চিন্তার ক্ষমতা তৈরি হয়।'},
            {id:'pt', n:'Pattern', i:'🧩', b:'আইকিউ বুস্টার', u:'প্যাটার্ন খোঁজার চ্যালেঞ্জ! এটি বাচ্চার আইকিউ (IQ) এবং ভিজ্যুয়াল মেমোরি বহুগুণ বাড়িয়ে দেয়।'},
            {id:'sd', n:'Sudoku', i:'🔢', b:'একাগ্রতা বৃদ্ধি', u:'সুডোকু খেললে বাচ্চার মনোযোগ বা কনসেন্ট্রেশন পাওয়ার বাড়ে, যা পড়াশোনায় অনেক সাহায্য করে।'},
            {id:'ms', n:'Magic Square', i:'⬛', b:'ম্যাথ জিনিয়াস', u:'ম্যাজিক স্কোয়ার সমাধান করে আপনার বাচ্চাকে বানান আগামীর ম্যাথ জিনিয়াস!'},
            {id:'msn', n:'Missing No', i:'❓', b:'ধাঁধা সমাধান', u:'লুকানো সংখ্যা খুঁজে বের করার মাধ্যমে বাচ্চার লজিক্যাল রিজননিং ক্ষমতা বৃদ্ধি পায়।'},
            {id:'cmp', n:'Compare', i:'⚖️', b:'তুলনা করার দক্ষতা', u:'ছোট-বড় এবং ওজনের তুলনা শেখার মাধ্যমে বাচ্চার গাণিতিক ধারণা পরিষ্কার হয়।'},
            {id:'tm', n:'Time Travel', i:'⏰', b:'সময় সচেতনতা', u:'সময় সচেতনতা এবং ঘড়ি দেখার সঠিক ধারণা তৈরির মাধ্যমে বাচ্চার মেধা বিকশিত হয়।'},
            {id:'frx', n:'Fraction', i:'🍕', b:'পিজ্জা ম্যাথ', u:'পিজ্জা স্লাইস দিয়ে ভগ্নাংশ শেখা! এটি ভগ্নাংশের মতো কঠিন বিষয়কে সবচেয়ে সহজ করে তোলে।'},
            {id:'sc', n:'Shape Count', i:'🔺', b:'জ্যামিতি মাস্টার', u:'জ্যামিতিক আকৃতি চেনার মাধ্যমে বাচ্চার ভিজ্যুয়াল স্পেশিয়াল ইন্টেলিজেন্স বৃদ্ধি পায়।'},
            {id:'mt', n:'Matchstick', i:'🕯️', b:'সমস্যা সমাধান', u:'ম্যাচস্টিক পাজল সমাধানের মাধ্যমে বাচ্চার জটিল সমস্যা সহজে সমাধানের মানসিকতা তৈরি হয়।'},
            {id:'mm', n:'Memory Match', i:'🧠', b:'ব্রেইন পাওয়ার', u:'মেমোরি কার্ড গেম খেললে বাচ্চার মনে রাখার ক্ষমতা বা মেমোরি রিটেনশন বহুগুণ বেড়ে যায়।'},
            {id:'kk', n:'Kakuro', i:'✖️', b:'সুপার ক্যালকুলেটর', u:'কাকুরু পাজল সমাধান করলে বাচ্চা সুপার ফাস্ট ক্যালকুলেটরে পরিণত হয়!'},
            {id:'cb', n:'Code Breaker', i:'🔐', b:'সিক্রেট কোড', u:'গোপন কোড ব্রেক করার মাধ্যমে বাচ্চার ক্রিটিক্যাল থিঙ্কিং এবং এনালাইটিক্যাল স্কিল বাড়ে।'},
            {id:'sy', n:'Symmetry', i:'🌗', b:'চিত্রাঙ্কন মেধা', u:'সিমেট্রি বা প্রতিসাম্য শেখার মাধ্যমে বাচ্চার সৃজনশীলতা এবং আর্টিস্টিক মেধা বিকশিত হয়।'}
        ];

        let state = { gameId:'', turn:0, score:0, isPremium: false };

        window.addEventListener('load', () => {
            const devID = getDeviceID();
            document.getElementById('device-id-txt').innerText = devID;
            try { if(typeof ThreeEngine !== 'undefined') ThreeEngine.init(); } catch(e) {}
            renderGrid();
            updateUI(devID);
            syncMembership(devID);
        });

        function getDeviceID() {
            let id = localStorage.getItem('mp_dev_id') || ('ID-' + Math.random().toString(36).substr(2, 6).toUpperCase());
            localStorage.setItem('mp_dev_id', id);
            return id;
        }

        async function syncMembership(id) {
            try {
                const res = await fetch(SHEET_CSV_URL);
                const csv = await res.text();
                const rows = csv.split('\n');
                for(let i=1; i<rows.length; i++) {
                    const cols = rows[i].split(',');
                    if(cols[1]?.trim() === id) {
                        const regDate = new Date(cols[0]?.trim());
                        const expiry = new Date(regDate);
                        expiry.setDate(expiry.getDate() + (parseInt(cols[2]) || 0));
                        if(new Date() < expiry) {
                            state.isPremium = true;
                            renderGrid(); updateUI(id);
                            break;
                        }
                    }
                }
            } catch(e) {}
        }

        function renderGrid() {
            const grid = document.getElementById('game-grid');
            if(!grid) return;
            grid.innerHTML = ''; 
            GAMES_LIST.forEach((g, idx) => {
                const isLocked = !state.isPremium && idx !== 0; 
                grid.innerHTML += `
                    <div onclick="handleGameClick(${idx})" class="game-btn flex flex-col items-center">
                        ${isLocked ? '<span class="lock-icon">🔒</span>' : ''}
                        <span style="font-size: 2rem; margin-bottom: 0.5rem;">${g.i}</span>
                        <span style="font-size: 8px; font-weight: 900; color: white; text-transform: uppercase;">${g.n}</span>
                        <span style="font-size: 7px; font-weight: bold; color: var(--cyan); margin-top: 4px;">${g.b}</span>
                    </div>`;
            });
        }

        function handleGameClick(idx) {
            const game = GAMES_LIST[idx];
            if(!state.isPremium && idx !== 0) {
                showBenefitModal(game);
            } else {
                state.gameId = game.id; showScreen('scr-engine'); nextPuzzle();
            }
        }

        function showBenefitModal(game) {
            const modal = document.createElement('div');
            modal.id = "benefit-modal";
            modal.innerHTML = `
                <div class="text-center">
                    <span style="font-size: 3rem; display: block; margin-bottom: 1rem;">${game.i}</span>
                    <h2 style="color: var(--cyan); font-weight: 900; margin-bottom: 0.5rem;">${game.n}</h2>
                    <p style="font-size: 11px; color: var(--slate); line-height: 1.6; margin-bottom: 1.5rem;">${game.u}</p>
                    <a href="https://wa.me/${WA_NUMBER}?text=Unlock ${game.n} for ID: ${getDeviceID()}" 
                       style="display: block; background: linear-gradient(to right, #06b6d4, #2563eb); color: white; padding: 1rem; border-radius: 1.5rem; text-decoration: none; font-weight: 900; font-size: 0.7rem; box-shadow: 0 10px 20px rgba(0,0,0,0.3);">
                       হোয়াটসঅ্যাপে আনলক করুন 🚀
                    </a>
                    <button onclick="this.parentElement.parentElement.remove()" style="background: none; border: none; color: var(--slate); font-size: 9px; font-weight: bold; margin-top: 1.5rem; cursor: pointer; text-transform: uppercase;">ফিরে যান</button>
                </div>`;
            document.body.appendChild(modal);
        }

        function updateUI(id) {
            const ctaZone = document.getElementById('cta-action');
            if(!ctaZone) return;
            if(state.isPremium) {
                ctaZone.innerHTML = `<a href="https://wa.me/${WA_NUMBER}?text=Support ID: ${id}" style="color: #4ade80; text-decoration: none; font-weight: bold; font-size: 0.7rem; border: 1px solid #4ade80; padding: 0.4rem 1rem; border-radius: 1rem; display: inline-block;">Premium Support ✅</a>`;
            } else {
                ctaZone.innerHTML = `<a href="https://wa.me/${WA_NUMBER}?text=Unlock all 15 puzzles for ID: ${id}" style="display: inline-block; background: linear-gradient(to right, #06b6d4, #2563eb); color: white; padding: 0.6rem 1.5rem; border-radius: 1.5rem; text-decoration: none; font-weight: 900; font-size: 0.65rem; box-shadow: 0 10px 20px rgba(0,0,0,0.3);">আনলক করতে হোয়াটসঅ্যাপ করুন 🚀</a>`;
            }
        }

        function nextPuzzle() {
            try {
                const gamesMap = { fr: FruitMath, py: PyramidMath, pt: PatternMath, sd: SudokuMath, ms: MagicSquare, msn: MissingNo, cmp: CompareMath, tm: TimeTravel, frx: FractionMath, sc: ShapeCount, mt: Matchstick, mm: MemoryMatch, kk: KakuroMath, cb: CodeBreaker, sy: Symmetry };
                const data = gamesMap[state.gameId].generate();
                document.getElementById('puzzle-stage').innerHTML = data.question;
                const mcGrid = document.getElementById('mcq-grid'); mcGrid.innerHTML = '';
                data.options.forEach(opt => { 
                    mcGrid.innerHTML += `<button onclick="checkAns('${opt}')" class="game-btn" style="font-size: 2rem; font-weight: 900; color: white; border-radius: 2rem;">${opt}</button>`; 
                });
            } catch(e) { showScreen('scr-menu'); }
        }
        
        function checkAns(val) {
            const gamesMap = { fr: FruitMath, py: PyramidMath, pt: PatternMath, sd: SudokuMath, ms: MagicSquare, msn: MissingNo, cmp: CompareMath, tm: TimeTravel, frx: FractionMath, sc: ShapeCount, mt: Matchstick, mm: MemoryMatch, kk: KakuroMath, cb: CodeBreaker, sy: Symmetry };
            if(val == gamesMap[state.gameId].answer) { 
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                if(typeof SoundEffects !== 'undefined') SoundEffects.play('success');
                setTimeout(nextPuzzle, 1000); 
            } else { 
                if(typeof SoundEffects !== 'undefined') SoundEffects.play('fail');
                alert("আবার চেষ্টা করো সোনামণি!"); 
            }
        }

        function showScreen(id) { document.querySelectorAll('#app > div').forEach(d => d.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
        function installApp() { alert("ব্রাউজার মেনু থেকে 'Install App' এ ক্লিক করুন।"); }
    </script>
</body>
</html>
