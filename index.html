<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>mathpuzzle.xyz | Free</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen">
    <canvas id="bg-canvas"></canvas>
    
    <div id="main-menu" class="glass-ui animate__animated animate__fadeIn">
        <h1 class="text-4xl font-black mb-10 text-cyan-400 tracking-tighter text-center">mathpuzzle.xyz</h1>
        <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4"></div>
    </div>

    <div id="info-screen" class="hidden glass-ui p-8 max-w-lg w-full text-center">
        <h2 class="text-2xl font-bold mb-6 text-cyan-400">Number of Players</h2>
        <input type="number" id="player-count" value="1" min="1" max="5" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 mb-6 text-center outline-none focus:border-cyan-400">
        <button onclick="generateNameInputs()" class="w-full bg-cyan-600 py-4 rounded-2xl font-black hover:bg-cyan-500">Next</button>
    </div>

    <div id="name-screen" class="hidden glass-ui p-8 max-w-lg w-full text-center">
        <h2 class="text-2xl font-bold mb-6 text-cyan-400">Enter Player Names</h2>
        <div id="name-input-container" class="max-h-60 overflow-y-auto mb-6 flex flex-col gap-3"></div>
        <button onclick="showAgeCategory()" class="w-full bg-cyan-600 py-4 rounded-2xl font-black hover:bg-cyan-500">Next</button>
    </div>

    <div id="age-screen" class="hidden glass-ui p-8 max-w-lg w-full text-center">
        <h2 class="text-2xl font-bold mb-6 text-cyan-400">Select Age Group</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-8">
            <button onclick="startGameWithAge('4-5')" class="bg-white/5 border border-white/10 p-3 rounded-xl hover:bg-cyan-500 transition-all">4-5 Years</button>
            <button onclick="startGameWithAge('6-7')" class="bg-white/5 border border-white/10 p-3 rounded-xl hover:bg-cyan-500 transition-all">6-7 Years</button>
            <button onclick="startGameWithAge('8-9')" class="bg-white/5 border border-white/10 p-3 rounded-xl hover:bg-cyan-500 transition-all">8-9 Years</button>
            <button onclick="startGameWithAge('10-11')" class="bg-white/5 border border-white/10 p-3 rounded-xl hover:bg-cyan-500 transition-all">10-11 Years</button>
            <button onclick="startGameWithAge('12+')" class="bg-white/5 border border-white/10 p-3 rounded-xl hover:bg-cyan-500 transition-all">12+ Years</button>
        </div>
    </div>

    <div id="game-screen" class="hidden glass-ui p-10 max-w-2xl w-full text-center relative">
        <div id="active-player-display" class="absolute top-16 left-8 text-sm font-bold text-white bg-cyan-500/20 px-4 py-1 rounded-full border border-cyan-500/30">
            Player: <span id="current-player-name" class="text-cyan-400">Name</span>
        </div>
        <div id="timer-display" class="absolute top-6 right-8 text-2xl font-black text-yellow-400">15s</div>
        <div id="level-tag" class="absolute top-6 left-8 text-xs font-bold uppercase tracking-widest text-cyan-400">Easy</div>
        <div id="puzzle-area" class="my-12 text-4xl font-black leading-relaxed"></div>
        <div id="mcq-grid" class="grid grid-cols-2 gap-4"></div>
    </div>

    <script src="js/engine.js"></script>
    <script src="js/games/fruitMath.js"></script>
    <script>
        let players = [];
        let currentPlayerIndex = 0;
        let selectedGameId = null, countdown, score = 0;

        window.addEventListener('load', () => {
            if (typeof ThreeEngine !== 'undefined') ThreeEngine.init();
            const grid = document.getElementById('game-grid');
            GAMES_LIST.forEach((g, idx) => {
                const isLocked = idx !== 0; 
                grid.innerHTML += `<div onclick="selectGame('${g.id}', ${isLocked})" class="game-card p-6 rounded-[2rem] flex flex-col items-center ${isLocked ? 'locked-card' : ''}"><span class="text-4xl mb-2">${g.i}</span><span class="text-xs font-bold text-white tracking-wide">${g.n}</span></div>`;
            });
        });

        function selectGame(id, locked) {
            if(locked) document.getElementById('lock-modal').classList.remove('hidden');
            else {
                selectedGameId = id;
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('info-screen').classList.remove('hidden');
            }
        }

        function generateNameInputs() {
            const count = parseInt(document.getElementById('player-count').value);
            const container = document.getElementById('name-input-container');
            container.innerHTML = '';
            for(let i = 1; i <= count; i++) {
                container.innerHTML += `<input type="text" placeholder="Player ${i} Name" class="player-name-input w-full p-4 rounded-2xl bg-white/5 border border-white/10 text-center outline-none focus:border-cyan-400">`;
            }
            document.getElementById('info-screen').classList.add('hidden');
            document.getElementById('name-screen').classList.remove('hidden');
        }

        function showAgeCategory() {
            const inputs = document.querySelectorAll('.player-name-input');
            players = Array.from(inputs).map(input => input.value || "Guest");
            document.getElementById('name-screen').classList.add('hidden');
            document.getElementById('age-screen').classList.remove('hidden');
        }

        function startGameWithAge(age) {
            document.getElementById('age-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            const levelMap = {'4-5': 'easy', '6-7': 'easy-medium', '8-9': 'medium', '10-11': 'medium-hard', '12+': 'hard'};
            FruitMath.level = levelMap[age];
            score = 0; currentPlayerIndex = 0;
            nextQuestion();
        }

        function nextQuestion() {
            clearInterval(countdown);
            document.getElementById('current-player-name').innerText = players[currentPlayerIndex];
            const data = FruitMath.generate();
            document.getElementById('level-tag').innerText = FruitMath.level;
            document.getElementById('puzzle-area').innerHTML = data.question;
            const mcqGrid = document.getElementById('mcq-grid');
            mcqGrid.innerHTML = '';
            data.options.forEach(opt => {
                mcqGrid.innerHTML += `<button onclick="handleAnswer(${opt})" class="bg-white/10 hover:bg-cyan-500 p-6 rounded-3xl text-2xl font-bold border border-white/10 transition-all active:scale-95">${opt}</button>`;
            });
            startTimer();
        }

        function startTimer() {
            let time = 15;
            countdown = setInterval(() => {
                time--; document.getElementById('timer-display').innerText = time + "s";
                if(time <= 0) { clearInterval(countdown); alert("Time's Up! Game Over."); location.reload(); }
            }, 1000);
        }

        function handleAnswer(selected) {
            if(selected === FruitMath.answer) {
                currentPlayerIndex = (currentPlayerIndex + 1) % players.length; // খেলোয়াড় পরিবর্তন
                score++;
                if(score >= 5) {
                    score = 0;
                    const levels = ['easy', 'easy-medium', 'medium', 'medium-hard', 'hard'];
                    let idx = levels.indexOf(FruitMath.level);
                    if(idx < levels.length - 1) FruitMath.level = levels[idx+1];
                    alert("Level Up! 🎉");
                }
                nextQuestion();
            } else { alert(`Wrong! ${players[currentPlayerIndex]} is out.`); location.reload(); }
        }
    </script>
</body>
</html>
