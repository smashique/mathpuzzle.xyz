<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Premium Zone | mathpuzzle.xyz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="style.css" rel="stylesheet">
</head>
<body class="flex items-center justify-center p-4 min-h-screen bg-black overflow-hidden">
    <canvas id="render-canvas" class="fixed top-0 left-0 -z-10 w-full h-full"></canvas>

    <div id="app" class="max-w-6xl w-full floating-ui p-8 sm:p-12 relative">
        <div id="denied-ui" class="hidden text-center">
            <h2 class="text-red-500 font-bold text-4xl mb-4">Access Denied!</h2>
            <p class="text-slate-300">Invalid or Expired Token. Please Subscribe.</p>
        </div>

        <div id="scr-menu" class="hidden">
            <h1 class="text-5xl font-black text-center mb-12 text-cyan-400">Premium Puzzles</h1>
            <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-5"></div>
        </div>

        <div id="scr-config" class="hidden text-center">
            <h2 id="config-title" class="text-3xl font-bold mb-10 text-cyan-300">Player Setup</h2>
            <div id="p-select" class="flex justify-center gap-8 mb-10">
                <button onclick="configPlayers(1)" class="game-btn p-10 rounded-3xl text-7xl">👤<br><span class="text-lg">1 Player</span></button>
                <button onclick="configPlayers(2)" class="game-btn p-10 rounded-3xl text-7xl">👥<br><span class="text-lg">2 Players</span></button>
            </div>
            <div id="name-zone" class="hidden space-y-4 max-w-sm mx-auto mb-6"></div>
            <div id="age-grid" class="hidden grid grid-cols-2 sm:grid-cols-3 gap-4 max-w-2xl mx-auto"></div>
        </div>

        <div id="scr-engine" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <div id="turn-txt" class="text-2xl font-black text-cyan-400">Player: -</div>
                    <div id="score-txt" class="text-sm text-fuchsia-400 font-bold">Score: 0</div>
                </div>
                <div id="clock-txt" class="text-4xl font-mono text-red-400 font-black">15.0</div>
            </div>
            <div class="w-full bg-white/10 h-2 rounded-full mb-8 overflow-hidden">
                <div id="t-bar" class="h-full bg-cyan-400" style="width: 100%"></div>
            </div>
            <div id="puzzle-stage" class="min-h-[250px] flex items-center justify-center text-4xl sm:text-6xl font-black text-center mb-10"></div>
            <div id="mcq-grid" class="grid grid-cols-2 gap-4 max-w-md mx-auto"></div>
        </div>
    </div>

    <script src="js/token.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/games/fruitMath.js"></script>
    <script>
        // Auth Logic
        window.addEventListener('load', () => {
            if (typeof ThreeEngine !== 'undefined') ThreeEngine.init();
            const params = new URLSearchParams(window.location.search);
            const auth = AuthService.validate(params.get('token')); 

            if(auth.status === 'authorized') {
                showScreen('scr-menu');
                renderGrid();
            } else {
                showScreen('denied-ui');
            }
        });

        // বাকি গেম লজিক index.html এর মতই থাকবে
    </script>
</body>
</html>
