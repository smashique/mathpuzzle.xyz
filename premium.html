<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Premium Zone | mathpuzzle.xyz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen">
    <canvas id="bg-canvas"></canvas>

    <div id="premium-content" class="max-w-5xl w-full floating-ui p-10 hidden relative">
        <h1 class="text-3xl font-black text-center mb-10 text-cyan-400">mathpuzzle.xyz Premium</h1>
        <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
            </div>
    </div>

    <script src="js/token.js"></script>
    <script src="js/engine.js"></script>
    <script>
        const games = [
            {id:'fr', n:'ফ্রুট ম্যাথ', i:'🍎'}, {id:'py', n:'পিরামিড', i:'⛰️'}, {id:'pt', n:'প্যাটার্ন', i:'🧩'}
            // ভবিষ্যতে আরও যোগ হবে...
        ];

        window.onload = () => {
            ThreeEngine.init(); // ৩ডি এনিমেশন শুরু
            
            const params = new URLSearchParams(window.location.search);
            const auth = AuthService.validate(params.get('token'));

            if(auth.status === 'authorized') {
                document.getElementById('premium-content').classList.remove('hidden');
                const grid = document.getElementById('game-grid');
                games.forEach(g => {
                    grid.innerHTML += `
                        <div class="game-card p-5 rounded-3xl flex flex-col items-center">
                            <span class="text-4xl mb-2">${g.i}</span>
                            <span class="text-xs font-bold text-white">${g.n}</span>
                        </div>`;
                });
            } else {
                alert("এক্সেস ডিনাইড! সঠিক টোকেন ব্যবহার করুন।");
            }
        };
    </script>
</body>
</html>
