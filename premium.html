<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Premium Zone | mathpuzzle.xyz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen">
    <canvas id="bg-canvas"></canvas>

    <div id="premium-ui" class="max-w-6xl w-full glass-ui p-10 hidden animate__animated animate__fadeIn">
        <h1 class="text-3xl font-black mb-10 text-cyan-400">প্রিমিয়াম গেম জোন</h1>
        <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-6">
            </div>
    </div>

    <div id="denied" class="hidden text-center glass-ui p-10">
        <h2 class="text-red-500 text-3xl font-bold mb-4">এক্সেস ডিনাইড!</h2>
        <p>সঠিক অ্যাডমিন টোকেন ব্যবহার করো।</p>
    </div>

    <script src="js/token.js"></script>
    <script src="js/engine.js"></script>
    <script>
        window.onload = () => {
            ThreeEngine.init();
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const auth = AuthService.validate(token); // '+' সমস্যা এখানে ফিক্সড

            if(auth.status === 'authorized') {
                document.getElementById('premium-ui').classList.remove('hidden');
                // ১৫টি গেম লোড করার লজিক এখানে কল হবে
            } else {
                document.getElementById('denied').classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
