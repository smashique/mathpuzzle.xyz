<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Premium Zone | mathpuzzle.xyz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen">
    <canvas id="bg-canvas"></canvas>
    
    <div id="premium-ui" class="hidden glass-ui animate__animated animate__fadeIn">
        <div class="flex justify-between items-center mb-10 px-4">
            <h1 class="text-3xl font-black text-cyan-400 tracking-tighter">mathpuzzle.xyz <span class="text-white text-xs font-normal">Premium</span></h1>
            <div class="text-xs bg-cyan-500/20 px-4 py-2 rounded-full border border-cyan-500/30 text-cyan-300 font-bold">Admin Access</div>
        </div>
        <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4"></div>
    </div>

    <div id="info-screen" class="hidden glass-ui p-8 max-w-md w-full text-center">
        <h2 class="text-2xl font-bold mb-6 text-cyan-400">Number of Players</h2>
        <input type="number" id="player-count" value="1" min="1" max="5" class="w-full p-4 mb-6 text-center bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-cyan-400">
        <button onclick="generateNameInputs()" class="w-full bg-cyan-600 py-4 rounded-2xl font-black hover:bg-cyan-500 transition-all">Next</button>
    </div>

    <div id="name-screen" class="hidden glass-ui p-8 max-w-md w-full text-center">
        <h2 class="text-2xl font-bold mb-6 text-cyan-400">Enter Player Names</h2>
        <div id="name-input-container" class="max-h-60 overflow-y-auto mb-6 flex flex-col gap-3"></div>
        <button onclick="showAgeScreen()" class="w-full bg-cyan-600 py-4 rounded-2xl font-black hover:bg-cyan-500 transition-all">Next</button>
    </div>

    <div id="age-screen" class="hidden glass-ui p-8 max-w-lg w-full text-center">
        <h2 class="text-2xl font-bold mb-6 text-cyan-400">Select Age Group</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-8">
            <button onclick="launchGame('4-5')" class="p-3 bg-white/5 border border-white/10 rounded-xl text-[10px] hover:bg-cyan-500">4-5 Years</button>
            <button onclick="launchGame('6-7')" class="p-3 bg-white/5 border border-white/10 rounded-xl text-[10px] hover:bg-cyan-500">6-7 Years</button>
            <button onclick="launchGame('8-9')" class="p-3 bg-white/5 border border-white/10 rounded-xl text-[10px] hover:bg-cyan-500">8-9 Years</button>
            <button onclick="launchGame('10-11')" class="p-3 bg-white/5 border border-white/10 rounded-xl text-[10px] hover:bg-cyan-500">10-11 Years</button>
            <button onclick="launchGame('12+')" class="p-3 bg-white/5 border border-white/10 rounded-xl text-[10px] hover:bg-cyan-500">12+ Years</button>
        </div>
    </div>

    <div id="game-screen" class="hidden glass-ui p-10 max-w-2xl w-full text-center relative">
        <div id="active-player-display" class="absolute top-16 left-8 text-sm font-bold text-white bg-cyan-500/20 px-4 py-1 rounded-full border border-cyan-500/30">
            Player: <span id="current-player-name" class="text-cyan-400">Name</span>
        </div>
        <div id="timer-display" class="absolute top-6 right-8 text-2xl font-black text-yellow-400">15s</div>
        <div id="level-tag" class="absolute top-6 left-8 text-xs font-bold uppercase tracking-widest text-cyan-400">Easy</div>
        <div id="puzzle-area" class="my-12 text-4xl font-black leading-relaxed"></div>
        <div id="mcq-grid" class="grid grid-cols-2 gap-4"></div>
    </div>

    <div id="denied-ui" class="hidden glass-ui max-w-md text-center"><h2 class="text-red-500 font-bold text-2xl">Access Denied!</h2><p class="text-slate-300 mt-2">Invalid or Expired Token</p></div>

    <script src="js/token.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/games/fruitMath.js"></script>
    <script>
        const GAMES = [
            {id:'fr', n:'Fruit Math', i:'🍎'}, {id:'py', n:'Pyramid', i:'⛰️'},
            {id:'pt', n:'Pattern', i:'🧩'}, {id:'sd', n:'Sudoku', i:'🔢'},
            {id:'ms', n:'Magic Square', i:'⬛'}, {id:'msn', n:'Missing No', i:'❓'},
            {id:'cmp', n:'Compare', i:'⚖️'}, {id:'tm', n:'Time Travel', i:'⏰'},
            {id:'frx', n:'Fraction', i:'🍕'}, {id:'sh', n:'Shape Count', i:'🔺'},
            {id:'mc', n:'Matchstick', i:'🕯️'}, {id:'mem', n:'Memory', i:'🧠'},
            {id:'kk', n:'Kakuro', i:'✖️'}, {id:'cd', n:'Code Breaker', i:'🔐'},
            {id:'sy', n:'Symmetry', i:'🌓'}
        ];

        let players = [], currentPlayerIndex = 0;
        let selectedGameId = null, countdown, score = 0;

        window.addEventListener('load', () => {
            if (typeof ThreeEngine !== 'undefined') ThreeEngine.init();
            const params = new URLSearchParams(window.location.search);
            const auth = AuthService.validate(params.get('token'));

            if(auth.status === 'authorized') {
                document.getElementById('premium-ui').classList.remove('hidden');
                const grid = document.getElementById('game-grid');
                GAMES.forEach(g => {
                    grid.innerHTML += `<div onclick="selectGame('${g.id}')" class="game-card p-6 rounded-[2rem] flex flex-col items-center"><span class="text-4xl mb-2">${g.i}</span><span class="text-xs font-bold text-white tracking-wide">${g.n}</span></div>`;
                });
            } else {
                document.getElementById('denied-ui').classList.remove('hidden');
            }
        });

        function selectGame(id) {
            selectedGameId = id;
            document.getElementById('premium-ui').classList.add('hidden');
            document.getElementById('info-screen').classList.remove('hidden');
        }

        function generateNameInputs() {
            const count = parseInt(document.getElementById('player-count').value);
            const container = document.getElementById('name-input-container');
            container.innerHTML = '';
            for(let i = 1; i <= count; i++) {
                container.innerHTML += `<input type="text" placeholder="Player ${i} Name" class="player-name-input w-full p-4 rounded-2xl bg-white/5 border border-white/10 text-center outline-none focus:border-cyan-400">`;
            }
            document.getElementById('info-screen').classList.add('hidden');
            document.getElementById('name-screen').classList.remove('hidden');
        }

        function showAgeScreen() {
            const inputs = document.querySelectorAll('.player-name-input');
            players = Array.from(inputs).map(input => input.value || "Guest");
            document.getElementById('name-screen').classList.add('hidden');
            document.getElementById('age-screen').classList.remove('hidden');
        }

        function launchGame(age) {
            if(selectedGameId !== 'fr') return alert("Coming Soon!");
            document.getElementById('age-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            const levelMap = {'4-5': 'easy', '6-7': 'easy-medium', '8-9': 'medium', '10-11': 'medium-hard', '12+': 'hard'};
            FruitMath.level = levelMap[age];
            score = 0; currentPlayerIndex = 0;
            nextQuestion();
        }

        function nextQuestion() {
            clearInterval(countdown);
            document.getElementById('current-player-name').innerText = players[currentPlayerIndex];
            const data = FruitMath.generate();
            document.getElementById('level-tag').innerText = FruitMath.level;
            document.getElementById('puzzle-area').innerHTML = data.question;
            const mcqGrid = document.getElementById('mcq-grid');
            mcqGrid.innerHTML = '';
            data.options.forEach(opt => {
                mcqGrid.innerHTML += `<button onclick="handleAnswer(${opt})" class="bg-white/10 hover:bg-cyan-500 p-6 rounded-3xl text-2xl font-bold border border-white/10 transition-all">${opt}</button>`;
            });
            startTimer();
        }

        function startTimer() {
            let time = 15;
            countdown = setInterval(() => {
                time--; document.getElementById('timer-display').innerText = time + "s";
                if(time <= 0) { clearInterval(countdown); alert("Time's Up!"); location.reload(); }
            }, 1000);
        }

        function handleAnswer(selected) {
            if(selected === FruitMath.answer) {
                currentPlayerIndex = (currentPlayerIndex + 1) % players.length; // খেলোয়াড় পরিবর্তন
                score++;
                if(score >= 5) {
                    score = 0;
                    const levels = ['easy', 'easy-medium', 'medium', 'medium-hard', 'hard'];
                    let idx = levels.indexOf(FruitMath.level);
                    if(idx < levels.length - 1) FruitMath.level = levels[idx+1];
                    alert("Level Up! 🎉");
                }
                nextQuestion();
            } else { alert(`Wrong answer from ${players[currentPlayerIndex]}! Game Over.`); location.reload(); }
        }
    </script>
</body>
</html>
