<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Premium Zone | mathpuzzle.xyz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen">
    <canvas id="bg-canvas"></canvas>
    
    <div id="premium-ui" class="glass-ui hidden animate__animated animate__fadeIn">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-black text-cyan-400 tracking-tighter">mathpuzzle.xyz <span class="text-white text-sm font-normal ml-2">Premium</span></h1>
            <div class="text-xs bg-cyan-500/20 px-4 py-2 rounded-full border border-cyan-500/30 text-cyan-300 font-bold">Admin Access</div>
        </div>
        <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4"></div>
    </div>

    <div id="game-screen" class="hidden glass-ui p-10 max-w-2xl w-full text-center relative animate__animated animate__zoomIn">
        <div id="timer-display" class="absolute top-6 right-8 text-2xl font-black text-yellow-400">15s</div>
        <div id="level-tag" class="absolute top-6 left-8 text-xs font-bold uppercase tracking-widest text-cyan-400">Easy</div>
        
        <div id="puzzle-area" class="my-12 text-4xl font-black leading-relaxed">
            </div>

        <div id="mcq-grid" class="grid grid-cols-2 gap-4">
            </div>
    </div>

    <div id="denied-ui" class="hidden glass-ui max-w-md text-center">
        <span class="text-6xl">🚫</span>
        <h2 class="text-2xl font-bold mt-4 text-red-500">এক্সেস ডিনাইড!</h2>
        <p class="text-slate-300 mt-2 mb-6">সঠিক অ্যাডমিন টোকেন ব্যবহার করুন।</p>
        <a href="index.html" class="text-cyan-400 underline text-sm">ফ্রি ভার্সনে ফিরে যান</a>
    </div>

    <script src="js/token.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/games/fruitMath.js"></script> <script>
        const GAMES = [
            {id:'fr', n:'Fruit Math', i:'🍎'}, {id:'py', n:'Pyramid', i:'⛰️'},
            {id:'pt', n:'Pattern', i:'🧩'}, {id:'sd', n:'Sudoku', i:'🔢'},
            {id:'ms', n:'Magic Square', i:'⬛'}, {id:'msn', n:'Missing No', i:'❓'},
            {id:'cmp', n:'Compare', i:'⚖️'}, {id:'tm', n:'Time Travel', i:'⏰'},
            {id:'frx', n:'Fraction', i:'🍕'}, {id:'sh', n:'Shape Count', i:'🔺'},
            {id:'mc', n:'Matchstick', i:'🕯️'}, {id:'mem', n:'Memory', i:'🧠'},
            {id:'kk', n:'Kakuro', i:'✖️'}, {id:'cd', n:'Code Breaker', i:'🔐'},
            {id:'sy', n:'Symmetry', i:'🌓'}
        ];

        let countdown;
        let score = 0;

        window.addEventListener('load', () => {
            if (typeof ThreeEngine !== 'undefined') ThreeEngine.init();

            const params = new URLSearchParams(window.location.search);
            const auth = AuthService.validate(params.get('token'));

            if(auth.status === 'authorized') {
                document.getElementById('premium-ui').classList.remove('hidden');
                const grid = document.getElementById('game-grid');
                GAMES.forEach(g => {
                    grid.innerHTML += `
                        <div onclick="initGame('${g.id}')" class="game-card p-6 rounded-[2rem] flex flex-col items-center">
                            <span class="text-4xl mb-2">${g.i}</span>
                            <span class="text-xs font-bold text-white tracking-wide">${g.n}</span>
                        </div>`;
                });
            } else {
                document.getElementById('denied-ui').classList.remove('hidden');
            }
        });

        function initGame(id) {
            if(id === 'fr') {
                document.getElementById('premium-ui').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                score = 0;
                FruitMath.level = 'easy';
                nextQuestion();
            } else {
                alert(id + " গেমটি শীঘ্রই আসছে!");
            }
        }

        function nextQuestion() {
            clearInterval(countdown);
            const data = FruitMath.generate();
            
            document.getElementById('level-tag').innerText = FruitMath.level;
            document.getElementById('puzzle-area').innerHTML = data.question;
            
            const mcqGrid = document.getElementById('mcq-grid');
            mcqGrid.innerHTML = '';
            
            data.options.forEach(opt => {
                mcqGrid.innerHTML += `
                    <button onclick="handleAnswer(${opt})" class="bg-white/10 hover:bg-cyan-500 p-6 rounded-3xl text-2xl font-bold border border-white/10 transition-all active:scale-95">
                        ${opt}
                    </button>`;
            });

            startTimer();
        }

        function startTimer() {
            let time = 15;
            const display = document.getElementById('timer-display');
            display.innerText = time + "s";
            
            countdown = setInterval(() => {
                time--;
                display.innerText = time + "s";
                if(time <= 0) {
                    clearInterval(countdown);
                    gameOver("সময় শেষ! ⏳");
                }
            }, 1000);
        }

        function handleAnswer(selected) {
            clearInterval(countdown);
            if(selected === FruitMath.answer) {
                score++;
                if(score >= 5) {
                    score = 0;
                    if(FruitMath.level === 'easy') FruitMath.level = 'medium';
                    else if(FruitMath.level === 'medium') FruitMath.level = 'hard';
                    alert("সাবাস! লেভেল আপ হচ্ছে। 🎉");
                }
                nextQuestion();
            } else {
                gameOver("ভুল উত্তর! গেম ওভার। ❌");
            }
        }

        function gameOver(msg) {
            alert(msg);
            location.reload(); // ভুল হলে রিস্টার্ট
        }
    </script>
</body>
</html>
