<script>
    window.onload = () => {
        ThreeEngine.init();
        const params = new URLSearchParams(window.location.search);
        const auth = AuthService.validate(params.get('token'));

        if(auth.status === 'authorized') {
            document.getElementById('premium-ui').classList.remove('hidden');
            const grid = document.getElementById('game-grid');
            GAMES.forEach(g => {
                const card = document.createElement('div');
                card.className = `game-card p-5 rounded-3xl flex flex-col items-center`;
                card.innerHTML = `<span class="text-4xl mb-2">${g.i}</span><span class="text-xs font-bold text-white">${g.n}</span>`;
                card.onclick = () => launchGame(g.id); // All games playable
                grid.appendChild(card);
            });
        } else {
            document.getElementById('denied').classList.remove('hidden');
        }
    };
</script>
