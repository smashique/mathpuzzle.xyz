<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Premium Zone | mathpuzzle.xyz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen">
    <canvas id="bg-canvas"></canvas>
    
    <div id="setup-screen" class="glass-ui hidden p-8 max-w-lg w-full text-center animate__animated animate__fadeIn">
        <h2 class="text-2xl font-bold mb-6 text-cyan-400">খেলোয়াড়ের তথ্য</h2>
        <input type="text" id="player-name" placeholder="তোমার নাম" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 mb-4 text-center outline-none focus:border-cyan-400">
        <input type="number" id="player-number" placeholder="মোবাইল নম্বর" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 mb-6 text-center outline-none focus:border-cyan-400">
        
        <p class="text-sm mb-4 text-slate-300">বয়স বিভাগ বেছে নাও:</p>
        <div class="grid grid-cols-3 gap-2 mb-8">
            <button onclick="setAge('4-5')" class="age-btn bg-white/5 border border-white/10 p-2 rounded-xl text-[10px] hover:bg-cyan-500">৪-৫ বছর</button>
            <button onclick="setAge('6-7')" class="age-btn bg-white/5 border border-white/10 p-2 rounded-xl text-[10px] hover:bg-cyan-500">৬-৭ বছর</button>
            <button onclick="setAge('8-9')" class="age-btn bg-white/5 border border-white/10 p-2 rounded-xl text-[10px] hover:bg-cyan-500">৮-৯ বছর</button>
            <button onclick="setAge('10-11')" class="age-btn bg-white/5 border border-white/10 p-2 rounded-xl text-[10px] hover:bg-cyan-500">১০-১১ বছর</button>
            <button onclick="setAge('12+')" class="age-btn bg-white/5 border border-white/10 p-2 rounded-xl text-[10px] hover:bg-cyan-500">১২+ বছর</button>
        </div>
        <button onclick="goToMenu()" class="w-full bg-cyan-600 py-4 rounded-2xl font-black hover:bg-cyan-500 transition-all">গেম শুরু করো</button>
    </div>

    <div id="premium-ui" class="hidden glass-ui animate__animated animate__fadeIn">
        <div class="flex justify-between items-center mb-8 px-4">
            <h1 class="text-3xl font-black text-cyan-400">mathpuzzle.xyz <span class="text-white text-xs font-normal">Premium</span></h1>
            <div id="welcome-msg" class="text-xs font-bold text-white bg-white/10 px-4 py-2 rounded-full"></div>
        </div>
        <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4"></div>
    </div>

    <div id="game-screen" class="hidden glass-ui p-10 max-w-2xl w-full text-center relative animate__animated animate__zoomIn">
        <div id="timer-display" class="absolute top-6 right-8 text-2xl font-black text-yellow-400">15s</div>
        <div id="level-tag" class="absolute top-6 left-8 text-xs font-bold uppercase tracking-widest text-cyan-400">Easy</div>
        <div id="puzzle-area" class="my-12 text-4xl font-black leading-relaxed"></div>
        <div id="mcq-grid" class="grid grid-cols-2 gap-4"></div>
    </div>

    <div id="denied-ui" class="hidden glass-ui max-w-md text-center"><h2 class="text-red-500 font-bold">Access Denied!</h2></div>

    <script src="js/token.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/games/fruitMath.js"></script>
    <script>
        const GAMES = [ /* ... index.html এর মত তালিকা ... */ ];
        let countdown, score = 0, selectedAge = '4-5';
        let playerData = { name: '', number: '' };

        function setAge(age) { selectedAge = age; /* বাটন হাইলাইট */ }

        function goToMenu() {
            playerData.name = document.getElementById('player-name').value;
            playerData.number = document.getElementById('player-number').value;
            if(!playerData.name || !playerData.number) return alert("তথ্য দাও!");
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('premium-ui').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = "স্বাগতম, " + playerData.name;
            renderMenu();
        }

        function renderMenu() {
            const grid = document.getElementById('game-grid');
            GAMES.forEach(g => {
                grid.innerHTML += `<div onclick="initGame('${g.id}')" class="game-card p-6 rounded-[2rem] flex flex-col items-center"><span class="text-4xl mb-2">${g.i}</span><span class="text-xs font-bold text-white tracking-wide">${g.n}</span></div>`;
            });
        }

        function initGame(id) {
            if(id === 'fr') {
                document.getElementById('premium-ui').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                score = 0;
                if(selectedAge === '4-5') FruitMath.level = 'easy';
                else if(selectedAge === '6-7') FruitMath.level = 'easy-medium';
                else if(selectedAge === '8-9') FruitMath.level = 'medium';
                else if(selectedAge === '10-11') FruitMath.level = 'medium-hard';
                else FruitMath.level = 'hard';
                nextQuestion();
            } else alert("শীঘ্রই আসছে!");
        }

        /* nextQuestion, startTimer, handleAnswer, gameOver ফাংশনগুলো index.html এর মতই হবে */

        window.addEventListener('load', () => {
            if (typeof ThreeEngine !== 'undefined') ThreeEngine.init();
            const params = new URLSearchParams(window.location.search);
            const auth = AuthService.validate(params.get('token'));
            if(auth.status === 'authorized') document.getElementById('setup-screen').classList.remove('hidden');
            else document.getElementById('denied-ui').classList.remove('hidden');
        });
    </script>
</body>
</html>
